<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:160px;height:600px;overflow:hidden;background:#082F49}
#ad{position:relative;width:160px;height:600px;overflow:hidden;cursor:pointer;border:1px solid #333;background:linear-gradient(180deg,#0C4A6E 0%,#082F49 100%);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;color:#F0F9FF;-webkit-font-smoothing:antialiased;user-select:none}
#ad>*,#deco>*{position:absolute}
#deco{inset:0;overflow:hidden}
#waves{left:-15%;bottom:0;width:130%;height:180px}
.hd{font-family:Georgia,"Times New Roman",serif;font-weight:400;letter-spacing:0;line-height:1.1}
.hd em{font-style:italic;color:#FCD34D}
#logo{display:flex;align-items:center;gap:8px}
.mk{display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#FCD34D,#67E8F9);color:#082F49}

.bn{font-family:Georgia,"Times New Roman",serif;font-weight:400;letter-spacing:.5px;white-space:nowrap}
#div{background:linear-gradient(180deg,transparent,rgba(252,211,77,0.5),transparent)}
#hero{display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(252,211,77,0.12);border:1px solid rgba(252,211,77,0.35);color:#FCD34D}
#hero svg{width:56%;height:56%}
#badge{z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:50%;transform:rotate(10deg)}
#badge::before{content:"";position:absolute;inset:3px;border-radius:50%;border:1px dashed currentColor;opacity:.45}
#badge b{font-weight:900;line-height:1}
#badge span{margin-top:2px;font-size:6.5px;font-weight:800;letter-spacing:.8px}
#sub{color:#A5CDE3}
#cta{z-index:2;display:flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap;border-radius:22px;background:#FCD34D;color:#082F49;font-weight:700;letter-spacing:.2px;box-shadow:0 6px 16px rgba(252,211,77,0.3)}
#cta span{position:relative;z-index:1}
#shine{position:absolute;left:0;top:-10px;width:30px;height:70px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:translateX(-60px) skewX(-20deg)}
#legal{font-size:8px;line-height:1.3;color:#A5CDE3}
#intro{inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;visibility:hidden}
#intro .ii{color:#FCD34D}
#intro .il{font-family:Georgia,"Times New Roman",serif;font-weight:400;letter-spacing:0;line-height:1.05}
#intro .il2{color:#FCD34D;font-style:italic}

#logo{left:0;top:22px;width:100%;flex-direction:column;gap:8px}
.mk{width:40px;height:40px;border-radius:11px}
.bn{font-size:13px;text-align:center}
#hero{left:38px;top:136px;width:84px;height:84px}
#badge{right:8px;top:118px;width:54px;height:54px}
#badge b{font-size:15px}
#content{left:14px;top:256px;width:132px}
#hl{font-size:18px}
#sub{margin-top:10px;font-size:11px;line-height:1.45}
#rule{width:24px;height:2px;margin:16px 0;background:#FCD34D}
#feats{list-style:none;display:grid;gap:12px}
.feat{display:flex;align-items:flex-start;gap:7px;font-size:11px;line-height:1.3}
.feat svg{flex:0 0 12px;width:12px;height:12px;margin-top:1px;color:#FCD34D}
#cta{left:14px;bottom:48px;width:132px;height:40px;font-size:12px}
#legal{left:10px;bottom:16px;width:140px;text-align:center}
#intro{padding:0 14px}
#intro .ii{width:64px;height:64px}
#intro .il{display:block;font-size:22px}
</style>
</head>
<body>
<div id="ad" onclick="window.open(window.clickTag)">

<div id="logo"><span class="mk"><svg class="" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="24" cy="17" r="7"/><path d="M24 4v2M12 9l2 2M36 9l-2 2"/><path d="M4 32c5-4 9-4 13 0s9 4 14 0 9-4 13 0"/><path d="M4 40c5-4 9-4 13 0s9 4 14 0 9-4 13 0"/></svg></span><span class="bn">Azure Coast</span></div>

<div id="content"><div id="hl" class="hd">Beachfront<br><em>Villas</em></div><p id="sub">Private pools · Direct beach access</p><i id="rule" style="display:block"></i><ul id="feats"><li class="feat"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6.5 5 9l5-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Infinity pools</span></li><li class="feat"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6.5 5 9l5-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Private beach club</span></li><li class="feat"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6.5 5 9l5-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Turnkey furnished</span></li></ul></div>

<script type="text/javascript">
(function () {
  if (!window.gsap) return; // fallback: the static end frame stays visible
  // 6s loop x 2 plays + 1s pause = 13s total, then rests on the end frame
  gsap.timeline({ repeat: 1, repeatDelay: 1 })
    .set("#intro",{autoAlpha:1},0)
    .from("#deco",{autoAlpha:0,duration:.8},0)
    .to("#waves",{x:19,duration:6,ease:"sine.inOut"},0)
    .from("#intro .ii",{scale:0,rotation:-25,duration:.6,ease:"back.out(2)"},.15)
    .from("#intro .il",{autoAlpha:0,y:18,stagger:.15,duration:.5,ease:"power3.out"},.4)
    .to("#intro",{autoAlpha:0,duration:.35,ease:"power2.in"},2.1)
    .from("#logo",{autoAlpha:0,y:-10,duration:.4},2.35)
    .from("#hero",{scale:0,autoAlpha:0,duration:.55,ease:"back.out(1.8)"},2.45)
    .from("#hl",{autoAlpha:0,y:14,duration:.45,ease:"power3.out"},2.6)
    .from("#sub",{autoAlpha:0,y:8,duration:.4},2.85)
    .from("#rule",{scaleX:0,transformOrigin:"left center",duration:.4},3)
    .from(".feat",{autoAlpha:0,x:-10,stagger:.15,duration:.35},3.1)
    .from("#cta",{autoAlpha:0,scale:.6,duration:.45,ease:"back.out(2)"},3.6)
    .to("#cta",{scale:1.06,duration:.25,yoyo:true,repeat:3,ease:"sine.inOut"},4.3)
    .to("#shine",{x:220,duration:.8,ease:"power2.inOut"},4.45)
    .set({},{},6);
})();
</script>
