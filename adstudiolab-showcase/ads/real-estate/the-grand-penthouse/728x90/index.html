<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="ad.size" content="width=728,height=90">
<title>The Grand — The Grand Penthouse | 728x90</title>
<script type="text/javascript">var clickTag = "https://www.google.com";</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:728px;height:90px;overflow:hidden;background:#141416}
#ad{position:relative;width:728px;height:90px;overflow:hidden;cursor:pointer;border:1px solid #333;background:linear-gradient(180deg,#111113 0%,#1F1F23 100%);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;color:#F3E9D2;-webkit-font-smoothing:antialiased;user-select:none}
#ad>*,#deco>*{position:absolute}
#deco{inset:0;overflow:hidden}
#frm{left:5px;top:5px;right:5px;bottom:5px;border:1px solid rgba(201,164,92,0.4)}
.hd{font-family:Georgia,"Times New Roman",serif;font-weight:400;letter-spacing:0;line-height:1.1}
.hd em{font-style:italic;color:#C9A45C}
#logo{display:flex;align-items:center;gap:8px}
.mk{display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#C9A45C,#E8CF8E);color:#141416}
.mk svg{width:62%;height:62%}
.bn{font-family:Georgia,"Times New Roman",serif;font-weight:400;letter-spacing:.5px;white-space:nowrap}
#div{background:linear-gradient(180deg,transparent,rgba(201,164,92,0.5),transparent)}
#hero{display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(201,164,92,0.12);border:1px solid rgba(201,164,92,0.35);color:#C9A45C}
#hero svg{width:56%;height:56%}
#badge{z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:50%;transform:rotate(10deg)}
#badge::before{content:"";position:absolute;inset:3px;border-radius:50%;border:1px dashed currentColor;opacity:.45}
#badge b{font-weight:900;line-height:1}
#badge span{margin-top:2px;font-size:6.5px;font-weight:800;letter-spacing:.8px}
#sub{color:#A89F8C}
#cta{z-index:2;display:flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap;border-radius:2px;background:linear-gradient(135deg,#EED79C,#C9A45C 50%,#A8843F);color:#141416;font-weight:700;letter-spacing:.2px;box-shadow:0 6px 16px rgba(201,164,92,0.3)}
#cta span{position:relative;z-index:1}
#shine{position:absolute;left:0;top:-10px;width:30px;height:70px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:translateX(-60px) skewX(-20deg)}
#legal{font-size:8px;line-height:1.3;color:#A89F8C}
#intro{inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;visibility:hidden}
#intro .ii{color:#C9A45C}
#intro .il{font-family:Georgia,"Times New Roman",serif;font-weight:400;letter-spacing:0;line-height:1.05}
#intro .il2{color:#C9A45C;font-style:italic}

#logo{left:16px;top:0;height:88px}
.mk{width:38px;height:38px;border-radius:10px}
.bn{font-size:17px}
#div{left:200px;top:20px;width:1px;height:48px}
#content{left:216px;top:0;width:272px;height:88px;display:flex;flex-direction:column;justify-content:center}
#hl{font-size:19px;white-space:nowrap}
#sub{margin-top:4px;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#badge,#hero{left:502px;top:16px;width:56px;height:56px}
#badge b{font-size:15px}
#cta{left:576px;top:24px;width:136px;height:40px;font-size:13px}
#legal{left:566px;top:64px;width:156px;text-align:center}
#intro{flex-direction:row;gap:14px}
#intro .ii{width:40px;height:40px}
#intro .il{font-size:24px}
</style>
</head>
<body>
<div id="ad" onclick="window.open(window.clickTag)">
<div id="deco"><i id="frm"></i></div>
<div id="logo"><span class="mk"><svg class="" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 44V14l6-9 6 9v30"/><path d="M10 44V26h8M30 26h8v18"/><path d="M5 44h38"/><path d="M22 18h4M22 25h4M22 32h4"/></svg></span><span class="bn">The Grand</span></div>
<i id="div"></i>
<div id="hero"><svg class="" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 44V14l6-9 6 9v30"/><path d="M10 44V26h8M30 26h8v18"/><path d="M5 44h38"/><path d="M22 18h4M22 25h4M22 32h4"/></svg></div>
<div id="content"><div id="hl" class="hd">The Grand <em>Penthouse</em></div><p id="sub">Private residences from the 60th floor</p></div>
<div id="cta"><span>Book Private Tour</span><i id="shine"></i></div>
<div id="intro"><svg class="ii" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 44V14l6-9 6 9v30"/><path d="M10 44V26h8M30 26h8v18"/><path d="M5 44h38"/><path d="M22 18h4M22 25h4M22 32h4"/></svg><div class="it"><span class="il">Life Above</span> <span class="il il2">the Skyline</span></div></div>
</div>
<script type="text/javascript">
(function () {
  if (!window.gsap) return; // fallback: the static end frame stays visible
  // 6s loop x 2 plays + 1s pause = 13s total, then rests on the end frame
  gsap.timeline({ repeat: 1, repeatDelay: 1 })
    .set("#intro",{autoAlpha:1},0)
    .from("#deco",{autoAlpha:0,duration:.8},0)
    .from("#frm",{scale:1.04,autoAlpha:0,duration:1,ease:"power2.out"},0)
    .from("#intro .ii",{scale:0,rotation:-25,duration:.6,ease:"back.out(2)"},.15)
    .from("#intro .il",{autoAlpha:0,y:18,stagger:.15,duration:.5,ease:"power3.out"},.4)
    .to("#intro",{autoAlpha:0,duration:.35,ease:"power2.in"},2.1)
    .from("#logo",{autoAlpha:0,x:-12,duration:.4},2.35)
    .from("#div",{scaleY:0,duration:.3},2.5)
    .from("#hero",{scale:0,autoAlpha:0,duration:.55,ease:"back.out(1.8)"},2.45)
    .from("#hl",{autoAlpha:0,y:14,duration:.45,ease:"power3.out"},2.6)
    .from("#sub",{autoAlpha:0,y:8,duration:.4},2.85)
    .from("#cta",{autoAlpha:0,scale:.6,duration:.45,ease:"back.out(2)"},3.6)
    .to("#cta",{scale:1.06,duration:.25,yoyo:true,repeat:3,ease:"sine.inOut"},4.3)
    .to("#shine",{x:220,duration:.8,ease:"power2.inOut"},4.45)
    .set({},{},6);
})();
</script>
</body>
</html>
