<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="ad.size" content="width=300,height=250">
<title>RoundUp — RoundUp Micro-Investing | 300x250</title>
<script type="text/javascript">var clickTag = "https://www.google.com";</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:300px;height:250px;overflow:hidden;background:#F0FDFA}
#ad{position:relative;width:300px;height:250px;overflow:hidden;cursor:pointer;border:1px solid #e2e8f0;background:linear-gradient(160deg,#E0F6F2 0%,#F0FDFA 72%);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;color:#042F2E;-webkit-font-smoothing:antialiased;user-select:none}
#ad>*{position:absolute}
.hd{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:800;letter-spacing:-.5px;line-height:1.1}
.hd em{font-style:normal;color:#0D9488}
.mk{display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0D9488,#F59E0B);color:#FFFFFF}
.mk svg{width:62%;height:62%}
.bn{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:800;letter-spacing:-.2px;white-space:nowrap}
#sub{color:#5E7D7C}
#cta{z-index:2;display:flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap;border-radius:10px;background:#0D9488;color:#FFFFFF;font-weight:700;letter-spacing:.2px;box-shadow:0 6px 16px rgba(13,148,136,0.3)}
#cta span{position:relative;z-index:1}
#shine{position:absolute;left:0;top:-10px;width:30px;height:70px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:translateX(-60px) skewX(-20deg)}
#legal{font-size:8px;line-height:1.3;color:#5E7D7C}
#logo{display:flex;align-items:center;gap:8px}
#num{display:block;font-weight:900;letter-spacing:-1px;line-height:1;color:#0D9488;font-variant-numeric:tabular-nums}
#st span{font-size:10.5px;color:#5E7D7C}
#ch{width:300px;height:100px}
#ch svg{display:block}
#dr{opacity:0}
#logo{left:14px;top:12px}
.mk{width:22px;height:22px;border-radius:6px}
.bn{font-size:12.5px}
#st{left:16px;top:38px}
#num{font-size:34px}
#ct{left:16px;top:96px;width:268px}
#hl{font-size:18px}
#ch{left:0;bottom:0}
#cta{left:16px;bottom:14px;height:32px;padding:0 18px;font-size:12.5px}
#legal{right:12px;bottom:6px;max-width:130px;text-align:right}
</style>
</head>
<body>
<div id="ad" onclick="window.open(window.clickTag)">
<div id="logo"><span class="mk"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="18" cy="12" rx="12" ry="5"/><path d="M6 12v8c0 3 5 5 12 5s12-2 12-5v-8"/><path d="M6 20v8c0 3 5 5 12 5"/><ellipse cx="32" cy="30" rx="10" ry="4.5"/><path d="M22 30v7c0 2.5 4.5 4.5 10 4.5s10-2 10-4.5v-7"/></svg></span><span class="bn">RoundUp</span></div>
<div id="ch"><svg width="300" height="100" viewBox="0 0 300 100" aria-hidden="true"><path d="M0 25H300" stroke="rgba(4,47,46,0.08)" stroke-dasharray="3 5"/><path d="M0 50H300" stroke="rgba(4,47,46,0.08)" stroke-dasharray="3 5"/><path d="M0 75H300" stroke="rgba(4,47,46,0.08)" stroke-dasharray="3 5"/><rect class="br" x="15.0" y="79.4" width="25.7" height="20.6" rx="2" fill="rgba(13,148,136,0.38)"/><rect class="br" x="55.7" y="73.8" width="25.7" height="26.2" rx="2" fill="rgba(13,148,136,0.38)"/><rect class="br" x="96.4" y="56.5" width="25.7" height="43.5" rx="2" fill="rgba(13,148,136,0.38)"/><rect class="br" x="137.1" y="48.1" width="25.7" height="51.9" rx="2" fill="rgba(13,148,136,0.38)"/><rect class="br" x="177.9" y="29.3" width="25.7" height="70.7" rx="2" fill="rgba(13,148,136,0.38)"/><rect class="br" x="218.6" y="25.6" width="25.7" height="74.4" rx="2" fill="rgba(13,148,136,0.38)"/><rect class="br" x="259.3" y="15.4" width="25.7" height="84.6" rx="2" fill="#0D9488"/></svg></div>
<div id="st"><b id="num">$1,284</b><span>saved in a year</span></div>
<div id="ct"><div id="hl" class="hd">Invest Your<br><em>Spare Change</em></div></div>
<div id="cta"><span>Start Saving</span><i id="shine"></i></div>
<p id="legal">Capital at risk. Illustrative figure.</p>
</div>
<script type="text/javascript">
(function () {
  if (!window.gsap) return; // fallback: the static end frame stays visible
  var N={v:0},E=document.getElementById("num");function F(v){return "$"+v.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g,",")+""}
  // 6s loop x 2 plays + 1s pause = 13s total, then rests on the end frame
  gsap.timeline({ repeat: 1, repeatDelay: 1 })
    .from("#logo",{autoAlpha:0,duration:.4},0)
    .from("#st",{autoAlpha:0,y:10,duration:.35},.2)
    .fromTo(N,{v:0},{v:1284,duration:1.5,ease:"power2.out",onUpdate:function(){E.textContent=F(N.v)}},.2)
    .from(".br",{scaleY:0,transformOrigin:"50% 100%",stagger:.1,duration:.5,ease:"power3.out"},.3)
    .from("#hl",{autoAlpha:0,y:12,duration:.45,ease:"power3.out"},2.3)
    .from("#cta",{autoAlpha:0,scale:.6,duration:.45,ease:"back.out(2)"},3.2)
    .from("#legal",{autoAlpha:0,duration:.3},3.4)
    .to("#cta",{scale:1.06,duration:.25,yoyo:true,repeat:3,ease:"sine.inOut"},4.3)
    .to("#shine",{x:220,duration:.8,ease:"power2.inOut"},4.45)
    .set({},{},6);
})();
</script>
</body>
</html>
