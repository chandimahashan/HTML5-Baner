<!DOCTYPE html>

<head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:160px;height:600px;overflow:hidden;background:#0B1324}
#ad{position:relative;width:160px;height:600px;overflow:hidden;cursor:pointer;border:1px solid #333;background:linear-gradient(160deg,#122341 0%,#0B1324 72%);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;color:#F1F5F9;-webkit-font-smoothing:antialiased;user-select:none}

.hd{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:800;letter-spacing:-.5px;line-height:1.1}
.hd em{font-style:normal;color:#3B82F6}
.mk{display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#3B82F6,#FBBF24);color:#FFFFFF}
.mk svg{width:62%;height:62%}
.bn{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:800;letter-spacing:-.2px;white-space:nowrap}
#sub{color:#9A9FA8}
#cta{z-index:2;display:flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap;border-radius:10px;background:#3B82F6;color:#FFFFFF;font-weight:700;letter-spacing:.2px;box-shadow:0 6px 16px rgba(59,130,246,0.3)}
#cta span{position:relative;z-index:1}
#shine{position:absolute;left:0;top:-10px;width:30px;height:70px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:translateX(-60px) skewX(-20deg)}
#legal{font-size:8px;line-height:1.3;color:#9A9FA8}
#logo{display:flex;align-items:center;gap:8px}
.cd{display:flex;align-items:center;gap:8px;padding:0 10px;border-radius:8px;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.12);box-shadow:0 6px 14px rgba(0,0,0,0.35);font-weight:600;line-height:1.15}
.cd i{flex:0 0 18px;display:flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:#3B82F6;color:#FFFFFF}
.cd i svg{width:10px;height:10px}
#hero{display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(59,130,246,0.12);border:1px solid rgba(59,130,246,0.35);color:#3B82F6}
#hero svg{width:56%;height:56%}
#cd1{left:14px;top:172px;width:132px;height:36px;font-size:10.5px;transform:rotate(-2deg)}
#cd2{left:20px;top:216px;width:132px;height:36px;font-size:10.5px;transform:rotate(1.5deg)}
#cd3{left:12px;top:260px;width:132px;height:36px;font-size:10.5px;transform:rotate(-1deg)}
#logo{left:0;top:22px;width:100%;flex-direction:column;gap:8px}
.mk{width:36px;height:36px;border-radius:10px}
.bn{font-size:13px;text-align:center}
#hl{left:14px;top:90px;width:132px;font-size:18px}
#hero{left:40px;top:318px;width:80px;height:80px}
#sub{left:14px;top:414px;width:132px;font-size:11px;line-height:1.45;text-align:center}
#cta{left:14px;bottom:48px;width:132px;height:40px;font-size:12px}
#legal{left:10px;bottom:16px;width:140px;text-align:center}
</style>
</head>
<body>
<div id="ad" onclick="window.open(window.clickTag)">
<div id="logo"><span class="mk"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="14" width="40" height="26" rx="4"/><path d="M17 14V9a3 3 0 0 1 3-3h8a3 3 0 0 1 3 3v5"/><path d="M4 25h40M22 25v4h4v-4"/></svg></span><span class="bn">Fortis Capital</span></div>

<div id="cd2" class="cd"><i><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6.5 5 9l5-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></i><span>Decision in 24h</span></div>
<div id="cd3" class="cd"><i><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6.5 5 9l5-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></i><span>No hidden fees</span></div>

<p id="sub">Funding decisions in 24 hours</p>
<div id="cta"><span>Get Funded</span><i id="shine"></i></div>
<p id="legal">Subject to credit approval.</p>
</div>
<script type="text/javascript">
(function () {
  if (!window.gsap) return; // fallback: the static end frame stays visible
  // 6s loop x 2 plays + 1s pause = 13s total, then rests on the end frame
  gsap.timeline({ repeat: 1, repeatDelay: 1 })
    .from(".cd",{x:144,rotation:14,autoAlpha:0,stagger:.35,duration:.55,ease:"back.out(1.5)"},.15)
    .from(".cd i",{scale:0,stagger:.35,duration:.3,ease:"back.out(3)"},.5)
    .from("#logo",{autoAlpha:0,y:-8,duration:.35},1.4)
    .from("#hl",{autoAlpha:0,y:14,duration:.45,ease:"power3.out"},1.6)
    .from("#hero",{scale:0,autoAlpha:0,duration:.5,ease:"back.out(1.8)"},1.9)
    .from("#sub",{autoAlpha:0,duration:.4},2.3)
    .to(".cd",{y:"-=3",duration:.3,stagger:.1,yoyo:true,repeat:1,ease:"sine.inOut"},2.6)
    .from("#cta",{autoAlpha:0,scale:.6,duration:.45,ease:"back.out(2)"},2.9)
    .from("#legal",{autoAlpha:0,duration:.3},3.1)
    .to("#cta",{scale:1.06,duration:.25,yoyo:true,repeat:3,ease:"sine.inOut"},4.3)
    .to("#shine",{x:220,duration:.8,ease:"power2.inOut"},4.45)
    .set({},{},6);
})();
</script>
