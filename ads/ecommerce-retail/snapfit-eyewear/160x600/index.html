<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="ad.size" content="width=160,height=600">
<title>SnapFit — SnapFit Eyewear | 160x600</title>
<script type="text/javascript">var clickTag = "https://www.google.com";</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:160px;height:600px;overflow:hidden;background:#FFFFFF}
#ad{position:relative;width:160px;height:600px;overflow:hidden;cursor:pointer;border:1px solid #e2e8f0;background:linear-gradient(160deg,#F0F4FE 0%,#FFFFFF 72%);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;color:#0F172A;-webkit-font-smoothing:antialiased;user-select:none}
#ad>*{position:absolute}
.hd{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:800;letter-spacing:-.5px;line-height:1.1}
.hd em{font-style:normal;color:#2563EB}
.mk{display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#2563EB,#7C3AED);color:#FFFFFF}
.mk svg{width:62%;height:62%}
.bn{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:800;letter-spacing:-.2px;white-space:nowrap}
#sub{color:#6A6F7B}
#cta{z-index:2;display:flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap;border-radius:10px;background:#2563EB;color:#FFFFFF;font-weight:700;letter-spacing:.2px;box-shadow:0 6px 16px rgba(37,99,235,0.3)}
#cta span{position:relative;z-index:1}
#shine{position:absolute;left:0;top:-10px;width:30px;height:70px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:translateX(-60px) skewX(-20deg)}
#legal{font-size:8px;line-height:1.3;color:#6A6F7B}
#pn{z-index:3;background:linear-gradient(180deg,#2563EB,#4C51EC)}
#pint{inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#FFFFFF;visibility:hidden}
#pint b{display:block;font-weight:900;letter-spacing:-1px;line-height:1}
#pbn,#pic,#pof{z-index:4;color:#FFFFFF}
#pbn{font-weight:800}
#pic svg{width:100%;height:100%}
#pof b{display:block;font-weight:900;line-height:1;letter-spacing:-.5px}
#pof span{font-weight:800;letter-spacing:1.5px;white-space:nowrap}
#pn{left:0;top:0;width:100%;height:240px}
#pint{padding:0 12px}
#pint b{font-size:21px}
#pbn{left:0;top:22px;width:100%;text-align:center;font-size:13px}
#pic{left:44px;top:60px;width:72px;height:72px}
#pof{left:0;top:148px;width:100%;text-align:center}
#pof b{font-size:34px}
#pof span{font-size:8.5px}
#ct{left:14px;top:262px;width:132px}
#hl{font-size:18px}
#sub{margin-top:10px;font-size:11px;line-height:1.45}
.fl{margin-top:16px}
#cta{left:14px;bottom:48px;width:132px;height:40px;font-size:12px}
#legal{left:10px;bottom:16px;width:140px;text-align:center}
.fl{list-style:none;display:grid;gap:10px}
.fl li{display:flex;align-items:flex-start;gap:7px;font-size:11px;line-height:1.3}
.fl svg{flex:0 0 12px;width:12px;height:12px;margin-top:1px;color:#2563EB}
</style>
</head>
<body>
<div id="ad" onclick="window.open(window.clickTag)">
<div id="pn"></div>
<div id="pint"><b>See the</b><b>Difference</b></div>
<span id="pbn" class="bn">SnapFit</span>
<div id="pic"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="13" cy="28" r="8"/><circle cx="35" cy="28" r="8"/><path d="M21 27c2-2 4-2 6 0M5 26l-1-10h6M43 26l1-10h-6"/></svg></div>
<div id="pof"><b>FREE</b><span>TRY-ON</span></div>
<div id="ct"><div id="hl" class="hd">Try 5 Frames<br><em>at Home</em></div><p id="sub">Free home try-on &amp; free shipping</p><ul class="fl"><li><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6.5 5 9l5-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>5 frames, 5 days</span></li><li><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6.5 5 9l5-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Prescription ready</span></li><li><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6.5 5 9l5-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Free returns</span></li></ul></div>
<div id="cta"><span>Start Try-On</span><i id="shine"></i></div>
</div>
<script type="text/javascript">
(function () {
  if (!window.gsap) return; // fallback: the static end frame stays visible
  // 6s loop x 2 plays + 1s pause = 13s total, then rests on the end frame
  gsap.timeline({ repeat: 1, repeatDelay: 1 })
    .set("#pint",{autoAlpha:1},0)
    .from("#pint b",{y:28,autoAlpha:0,stagger:.15,duration:.45,ease:"power3.out"},.15)
    .to("#pint",{autoAlpha:0,duration:.3},1.7)
    .fromTo("#pn",{height:600},{height:240,duration:.7,ease:"power3.inOut"},1.95)
    .from("#pbn",{autoAlpha:0,y:-8,duration:.35},2.5)
    .from("#pic",{autoAlpha:0,scale:.4,rotation:-20,duration:.5,ease:"back.out(2)"},2.55)
    .from("#pof",{autoAlpha:0,y:10,duration:.4},2.7)
    .from("#hl",{autoAlpha:0,x:20,duration:.45,ease:"power3.out"},2.6)
    .from("#sub",{autoAlpha:0,x:14,duration:.4},2.8)
    .from(".fl li",{autoAlpha:0,x:-10,stagger:.15,duration:.35},3)
    .from("#cta",{autoAlpha:0,y:12,duration:.45,ease:"back.out(2)"},3.3)
    .to("#cta",{scale:1.06,duration:.25,yoyo:true,repeat:3,ease:"sine.inOut"},4.3)
    .to("#shine",{x:220,duration:.8,ease:"power2.inOut"},4.45)
    .set({},{},6);
})();
</script>
</body>
</html>
