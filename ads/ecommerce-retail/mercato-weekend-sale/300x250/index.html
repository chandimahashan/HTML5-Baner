<!DOCTYPE html>
<html lang="en">
<head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:300px;height:250px;overflow:hidden;background:#111111}
#ad{position:relative;width:300px;height:250px;overflow:hidden;cursor:pointer;border:1px solid #333;background:linear-gradient(160deg,#322B12 0%,#111111 72%);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;color:#FAFAFA;-webkit-font-smoothing:antialiased;user-select:none}

.hd{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:800;letter-spacing:-.5px;line-height:1.1}
.hd em{font-style:normal;color:#FACC15}
.mk{display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#FACC15,#EF4444);color:#0B0F19}

.bn{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:800;letter-spacing:-.2px;white-space:nowrap}
#sub{color:#A1A1A1}

#cta span{position:relative;z-index:1}
#shine{position:absolute;left:0;top:-10px;width:30px;height:70px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:translateX(-60px) skewX(-20deg)}
#legal{font-size:8px;line-height:1.3;color:#A1A1A1}
#logo{display:flex;align-items:center;gap:8px}
#strip,#strip2{z-index:3;display:flex;align-items:center;overflow:hidden;background:#FACC15;color:#0B0F19;font-size:10px;font-weight:800;letter-spacing:1.5px}
.mq{display:flex;white-space:nowrap}
.mq span{padding-right:.5em}
#big b{display:block;font-weight:900;letter-spacing:-2px;line-height:.9;color:#FACC15}
#big span{display:block;margin-top:4px;font-weight:800;letter-spacing:2px}
#cdl{font-size:8.5px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:#A1A1A1}
#cd{display:flex;perspective:200px}
.bx{display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:6px;background:rgba(255,255,255,0.08);border:1px solid rgba(250,204,21,0.3)}
.bx b{display:block;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.bx small{margin-top:2px;font-size:6.5px;font-weight:700;letter-spacing:1px;color:#A1A1A1}

#strip{left:0;top:0;width:100%;height:24px}
#logo{left:14px;top:34px}
.mk{width:20px;height:20px;border-radius:5px}
.bn{font-size:12px}
#big{left:14px;top:58px}
#big b{font-size:52px}
#big span{font-size:11px}
#hl{left:146px;top:62px;width:140px;font-size:16px}
#cdl{left:14px;top:136px}
#cd{left:14px;top:150px;gap:8px}
.bx{width:58px;height:40px}
.bx b{font-size:18px}
#hero{left:218px;top:136px;width:56px;height:56px}
#cta{left:14px;right:14px;bottom:12px;height:34px;font-size:13px}
#legal{right:14px;top:196px;font-size:7px}

</head>
<body>
<div id="ad" onclick="window.open(window.clickTag)">
<div id="strip"><div id="mq" class="mq"><span>WEEKEND MEGA SALE • 70% OFF • WEEKEND MEGA SALE • 70% OFF • WEEKEND MEGA SALE • 70% OFF • </span><span>WEEKEND MEGA SALE • 70% OFF • WEEKEND MEGA SALE • 70% OFF • WEEKEND MEGA SALE • 70% OFF • </span></div></div>
<div id="logo"><span class="mk"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8h16l20 20-14 14L8 22z"/><circle cx="15" cy="17" r="3"/><path d="M22 30l8-8"/></svg></span><span class="bn">Mercato</span></div>

<div id="hl" class="hd">Weekend<br><em>Mega Sale</em></div>
<p id="cdl">Offer ends in</p>

<div id="cta"><span>Shop the Sale</span><i id="shine"></i></div>
</div>
<script type="text/javascript">
(function () {
  if (!window.gsap) return; // fallback: the static end frame stays visible
  var D3=document.getElementById("d3");function T(v){D3.textContent=v}
  // 6s loop x 2 plays + 1s pause = 13s total, then rests on the end frame
  gsap.timeline({ repeat: 1, repeatDelay: 1 })
    .fromTo("#mq",{xPercent:0},{xPercent:-50,duration:6,ease:"none"},0)
    .from("#strip",{yPercent:-100,duration:.4},0)
    .from("#logo",{autoAlpha:0,duration:.35},.2)
    .from("#big b",{scale:3,autoAlpha:0,duration:.45,ease:"power4.out"},.35)
    .from("#big span",{autoAlpha:0,y:8,duration:.3},.7)
    .to("#big b",{scale:1.08,duration:.12,yoyo:true,repeat:3},.9)
    .from("#hl",{autoAlpha:0,x:14,duration:.4},1.1)
    .from("#cdl",{autoAlpha:0,duration:.3},1.3)
    .from(".bx",{autoAlpha:0,y:12,stagger:.1,duration:.35,ease:"back.out(2)"},1.35)
    .call(T,["48"],0)
    .call(T,["47"],1.8)
    .fromTo("#d3",{rotationX:-90},{rotationX:0,duration:.25,ease:"back.out(2)",immediateRender:false},1.8)
    .call(T,["46"],2.8)
    .fromTo("#d3",{rotationX:-90},{rotationX:0,duration:.25,ease:"back.out(2)",immediateRender:false},2.8)
    .call(T,["45"],3.8)
    .fromTo("#d3",{rotationX:-90},{rotationX:0,duration:.25,ease:"back.out(2)",immediateRender:false},3.8)
    .call(T,["44"],4.8)
    .fromTo("#d3",{rotationX:-90},{rotationX:0,duration:.25,ease:"back.out(2)",immediateRender:false},4.8)
    .call(T,["43"],5.8)
    .fromTo("#d3",{rotationX:-90},{rotationX:0,duration:.25,ease:"back.out(2)",immediateRender:false},5.8)
    .from("#hero",{scale:0,duration:.45,ease:"back.out(2)"},2)
    .from("#cta",{autoAlpha:0,scale:.6,duration:.45,ease:"back.out(2)"},2.5)
    .to("#cta",{scale:1.06,duration:.25,yoyo:true,repeat:3,ease:"sine.inOut"},4.3)
    .to("#shine",{x:220,duration:.8,ease:"power2.inOut"},4.45)
    .set({},{},6);
})();
</script>
</body>
</html>
