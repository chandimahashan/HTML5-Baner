<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="ad.size" content="width=300,height=250">
<title>Aurum — Aurum Fine Jewelry | 300x250</title>
<script type="text/javascript">var clickTag = "https://www.google.com";</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:300px;height:250px;overflow:hidden;background:#04241C}
#ad{position:relative;width:300px;height:250px;overflow:hidden;cursor:pointer;border:1px solid #333;background:linear-gradient(160deg,#213720 0%,#04241C 72%);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;color:#F5E6C4;-webkit-font-smoothing:antialiased;user-select:none}
#ad>*{position:absolute}
.hd{font-family:Georgia,"Times New Roman",serif;font-weight:400;letter-spacing:0;line-height:1.1}
.hd em{font-style:italic;color:#D4AF37}
.mk{display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#D4AF37,#F5E6C4);color:#FFFFFF}
.mk svg{width:62%;height:62%}
.bn{font-family:Georgia,"Times New Roman",serif;font-weight:400;letter-spacing:.5px;white-space:nowrap}
#sub{color:#999C84}
#cta{z-index:2;display:flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap;border-radius:2px;background:#D4AF37;color:#FFFFFF;font-weight:700;letter-spacing:.2px;box-shadow:0 6px 16px rgba(212,175,55,0.3)}
#cta span{position:relative;z-index:1}
#shine{position:absolute;left:0;top:-10px;width:30px;height:70px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:translateX(-60px) skewX(-20deg)}
#legal{font-size:8px;line-height:1.3;color:#999C84}
#rays{border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(212,175,55,0.22) 0deg 7deg,transparent 7deg 20deg);-webkit-mask-image:radial-gradient(circle,#000 18%,transparent 68%);mask-image:radial-gradient(circle,#000 18%,transparent 68%)}
#glow{border-radius:50%;background:radial-gradient(circle,rgba(245,230,196,0.45),transparent 65%)}
#pod{border-radius:50%;background:radial-gradient(ellipse,rgba(212,175,55,0.55),transparent 70%)}
#hero{color:#D4AF37;filter:drop-shadow(0 0 8px rgba(212,175,55,0.6))}
#hero svg{width:100%;height:100%}
.pt{width:4px;height:4px;border-radius:50%;background:#F5E6C4}
#bn{font-weight:800;letter-spacing:3px;text-transform:uppercase;color:#D4AF37}
#it{font-family:Georgia,"Times New Roman",serif;font-weight:400;letter-spacing:0;line-height:1.1;visibility:hidden}
#it em{font-style:italic;color:#D4AF37}
#rays{left:35px;top:-31px;width:230px;height:230px}
#glow{left:90px;top:24px;width:120px;height:120px}
#hero{left:119px;top:53px;width:62px;height:62px}
#pod{left:90px;top:116px;width:120px;height:16px}
#p0{left:106px;top:104px}
#p1{left:190px;top:94px}
#p2{left:126px;top:78px}
#p3{left:180px;top:114px}
#p4{left:142px;top:118px}
#p5{left:202px;top:74px}
#bn{left:0;top:12px;width:100%;text-align:center;font-size:10.5px}
#it,#ct{left:16px;top:140px;width:268px;text-align:center}
#it{font-size:22px}
#hl{font-size:19px}
#cta{left:75px;bottom:16px;width:150px;height:34px;font-size:13px}
#legal{left:0;bottom:6px;width:100%;text-align:center;font-size:7px}
</style>
</head>
<body>
<div id="ad" onclick="window.open(window.clickTag)">
<div id="rays"></div>
<div id="glow"></div>
<div id="pod"></div>
<i id="p0" class="pt"></i>
<i id="p1" class="pt"></i>
<i id="p2" class="pt"></i>
<i id="p3" class="pt"></i>
<i id="p4" class="pt"></i>
<i id="p5" class="pt"></i>
<div id="hero"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 6h24l8 12-20 24L4 18z"/><path d="M4 18h40M18 6l-4 12 10 24 10-24-4-12"/></svg></div>
<span id="bn">Aurum</span>
<div id="it">Crafted <em>in Gold</em></div>
<div id="ct"><div id="hl" class="hd">The Eternity<br><em>Collection</em></div></div>
<div id="cta"><span>Explore Pieces</span><i id="shine"></i></div>
</div>
<script type="text/javascript">
(function () {
  if (!window.gsap) return; // fallback: the static end frame stays visible
  // 6s loop x 2 plays + 1s pause = 13s total, then rests on the end frame
  gsap.timeline({ repeat: 1, repeatDelay: 1 })
    .from("#glow",{scale:.3,autoAlpha:0,duration:1,ease:"power2.out"},0)
    .from("#rays",{scale:.4,autoAlpha:0,duration:1.2,ease:"power2.out"},0)
    .to("#rays",{rotation:45,duration:6,ease:"none"},0)
    .from("#hero",{y:-50,scale:.5,autoAlpha:0,duration:.8,ease:"bounce.out"},.2)
    .from("#pod",{scaleX:0,autoAlpha:0,duration:.5},.6)
    .fromTo(".pt",{y:14,autoAlpha:0},{y:-22,autoAlpha:1,duration:.9,stagger:.2,yoyo:true,repeat:1,ease:"sine.out"},.5)
    .from("#bn",{autoAlpha:0,letterSpacing:"10px",duration:.6},.3)
    .fromTo("#it",{autoAlpha:0,y:12},{autoAlpha:1,y:0,duration:.45},.7)
    .to("#it",{autoAlpha:0,y:-10,duration:.3},2)
    .from("#hl",{autoAlpha:0,y:12,duration:.45,ease:"power3.out"},2.3)
    .from("#cta",{autoAlpha:0,scale:.6,duration:.45,ease:"back.out(2)"},3.1)
    .to("#cta",{scale:1.06,duration:.25,yoyo:true,repeat:3,ease:"sine.inOut"},4.3)
    .to("#shine",{x:220,duration:.8,ease:"power2.inOut"},4.45)
    .set({},{},6);
})();
</script>
</body>
</html>
