<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="ad.size" content="width=300,height=250">
<title>PetPal — PetPal Premium Food | 300x250</title>
<script type="text/javascript">var clickTag = "https://www.google.com";</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:300px;height:250px;overflow:hidden;background:#FFF8EC}
#ad{position:relative;width:300px;height:250px;overflow:hidden;cursor:pointer;border:1px solid #e2e8f0;background:linear-gradient(160deg,#FEEDDC 0%,#FFF8EC 72%);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;color:#422006;-webkit-font-smoothing:antialiased;user-select:none}
#ad>*{position:absolute}
.hd{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:800;letter-spacing:-.5px;line-height:1.1}
.hd em{font-style:normal;color:#EA580C}
.mk{display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#EA580C,#0D9488);color:#FFFFFF}
.mk svg{width:62%;height:62%}
.bn{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:800;letter-spacing:-.2px;white-space:nowrap}
#sub{color:#8A725D}
#cta{z-index:2;display:flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap;border-radius:10px;background:#EA580C;color:#FFFFFF;font-weight:700;letter-spacing:.2px;box-shadow:0 6px 16px rgba(234,88,12,0.3)}
#cta span{position:relative;z-index:1}
#shine{position:absolute;left:0;top:-10px;width:30px;height:70px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:translateX(-60px) skewX(-20deg)}
#legal{font-size:8px;line-height:1.3;color:#8A725D}
#logo{display:flex;align-items:center;gap:8px}
.cd{display:flex;align-items:center;gap:8px;padding:0 10px;border-radius:8px;background:#FFFFFF;border:1px solid rgba(66,32,6,0.08);box-shadow:0 6px 14px rgba(0,0,0,0.08);font-weight:600;line-height:1.15}
.cd i{flex:0 0 18px;display:flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:#EA580C;color:#FFFFFF}
.cd i svg{width:10px;height:10px}
#hero{display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(234,88,12,0.12);border:1px solid rgba(234,88,12,0.35);color:#EA580C}
#hero svg{width:56%;height:56%}
#cd1{left:16px;top:100px;width:176px;height:28px;font-size:11px;transform:rotate(-2deg)}
#cd2{left:26px;top:134px;width:176px;height:28px;font-size:11px;transform:rotate(1.5deg)}
#cd3{left:18px;top:168px;width:176px;height:28px;font-size:11px;transform:rotate(-1deg)}
#logo{left:14px;top:12px}
.mk{width:22px;height:22px;border-radius:6px}
.bn{font-size:12.5px}
#hl{left:16px;top:40px;width:206px;font-size:19px}
#hero{left:206px;top:112px;width:78px;height:78px}
#cta{left:16px;bottom:12px;height:32px;padding:0 18px;font-size:12.5px}
#legal{right:12px;bottom:8px;max-width:100px;text-align:right}
.bdg{right:10px;top:8px;z-index:4;width:54px;height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:50%;background:#0D9488;color:#FFFFFF;transform:rotate(10deg);box-shadow:0 6px 16px rgba(13,148,136,0.4)}
.bdg::before{content:"";position:absolute;inset:3px;border-radius:50%;border:1px dashed currentColor;opacity:.45}
.bdg b{font-size:16px;font-weight:900;line-height:1}
.bdg span{margin-top:2px;font-size:6.5px;font-weight:800;letter-spacing:.6px;white-space:nowrap}
</style>
</head>
<body>
<div id="ad" onclick="window.open(window.clickTag)">
<div id="logo"><span class="mk"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="24" cy="32" rx="9" ry="8"/><circle cx="12" cy="20" r="4"/><circle cx="20" cy="12" r="4"/><circle cx="28" cy="12" r="4"/><circle cx="36" cy="20" r="4"/></svg></span><span class="bn">PetPal</span></div>
<div id="hl" class="hd">Vet-Approved<br><em>Pet Nutrition</em></div>
<div id="cd1" class="cd"><i><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6.5 5 9l5-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></i><span>Real meat first</span></div>
<div id="cd2" class="cd"><i><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6.5 5 9l5-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></i><span>No fillers ever</span></div>
<div id="cd3" class="cd"><i><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6.5 5 9l5-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></i><span>Delivered monthly</span></div>
<div id="hero"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="24" cy="32" rx="9" ry="8"/><circle cx="12" cy="20" r="4"/><circle cx="20" cy="12" r="4"/><circle cx="28" cy="12" r="4"/><circle cx="36" cy="20" r="4"/></svg></div>
<div class="bdg"><b>30%</b><span>1ST BOX</span></div>
<div id="cta"><span>Build a Box</span><i id="shine"></i></div>
</div>
<script type="text/javascript">
(function () {
  if (!window.gsap) return; // fallback: the static end frame stays visible
  // 6s loop x 2 plays + 1s pause = 13s total, then rests on the end frame
  gsap.timeline({ repeat: 1, repeatDelay: 1 })
    .from(".cd",{x:270,rotation:14,autoAlpha:0,stagger:.35,duration:.55,ease:"back.out(1.5)"},.15)
    .from(".cd i",{scale:0,stagger:.35,duration:.3,ease:"back.out(3)"},.5)
    .from("#logo",{autoAlpha:0,y:-8,duration:.35},1.4)
    .from("#hl",{autoAlpha:0,y:14,duration:.45,ease:"power3.out"},1.6)
    .from("#hero",{scale:0,autoAlpha:0,duration:.5,ease:"back.out(1.8)"},1.9)
    .from(".bdg",{scale:0,rotation:-160,duration:.5,ease:"back.out(2)"},2.2)
    .to(".cd",{y:"-=3",duration:.3,stagger:.1,yoyo:true,repeat:1,ease:"sine.inOut"},2.6)
    .from("#cta",{autoAlpha:0,scale:.6,duration:.45,ease:"back.out(2)"},2.9)
    .to("#cta",{scale:1.06,duration:.25,yoyo:true,repeat:3,ease:"sine.inOut"},4.3)
    .to("#shine",{x:220,duration:.8,ease:"power2.inOut"},4.45)
    .set({},{},6);
})();
</script>
</body>
</html>
