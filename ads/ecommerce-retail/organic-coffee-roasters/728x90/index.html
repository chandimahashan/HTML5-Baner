<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="ad.size" content="width=728,height=90">
<title>Ember &amp; Oak — Organic Coffee Roasters | 728x90</title>
<script type="text/javascript">var clickTag = "https://www.google.com";</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:728px;height:90px;overflow:hidden;background:#150E0A}
#ad{position:relative;width:728px;height:90px;overflow:hidden;cursor:pointer;border:1px solid #333;background:linear-gradient(160deg,#2B1A12 0%,#150E0A 100%);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;color:#FBF3E9;-webkit-font-smoothing:antialiased;user-select:none}
#ad>*,#deco>*{position:absolute}
#deco{inset:0;overflow:hidden}
#waves{left:-15%;bottom:0;width:130%;height:34px}
.hd{font-family:Georgia,"Times New Roman",serif;font-weight:400;letter-spacing:0;line-height:1.1}
.hd em{font-style:italic;color:#E0A96D}
#logo{display:flex;align-items:center;gap:8px}
.mk{display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#E0A96D,#7FB069);color:#150E0A}
.mk svg{width:62%;height:62%}
.bn{font-family:Georgia,"Times New Roman",serif;font-weight:400;letter-spacing:.5px;white-space:nowrap}
#div{background:linear-gradient(180deg,transparent,rgba(224,169,109,0.5),transparent)}
#hero{display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(224,169,109,0.12);border:1px solid rgba(224,169,109,0.35);color:#E0A96D}
#hero svg{width:56%;height:56%}
#badge{z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:50%;transform:rotate(10deg);background:#7FB069;color:#10200C;box-shadow:0 6px 16px rgba(127,176,105,0.4)}
#badge::before{content:"";position:absolute;inset:3px;border-radius:50%;border:1px dashed currentColor;opacity:.45}
#badge b{font-weight:900;line-height:1}
#badge span{margin-top:2px;font-size:6.5px;font-weight:800;letter-spacing:.8px}
#sub{color:#C9B29B}
#cta{z-index:2;display:flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap;border-radius:6px;background:#E0A96D;color:#150E0A;font-weight:700;letter-spacing:.2px;box-shadow:0 6px 16px rgba(224,169,109,0.3)}
#cta span{position:relative;z-index:1}
#shine{position:absolute;left:0;top:-10px;width:30px;height:70px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:translateX(-60px) skewX(-20deg)}
#legal{font-size:8px;line-height:1.3;color:#C9B29B}
#intro{inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;visibility:hidden}
#intro .ii{color:#E0A96D}
#intro .il{font-family:Georgia,"Times New Roman",serif;font-weight:400;letter-spacing:0;line-height:1.05}
#intro .il2{color:#E0A96D;font-style:italic}

#logo{left:16px;top:0;height:88px}
.mk{width:38px;height:38px;border-radius:10px}
.bn{font-size:17px}
#div{left:200px;top:20px;width:1px;height:48px}
#content{left:216px;top:0;width:272px;height:88px;display:flex;flex-direction:column;justify-content:center}
#hl{font-size:19px;white-space:nowrap}
#sub{margin-top:4px;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#badge,#hero{left:502px;top:16px;width:56px;height:56px}
#badge b{font-size:15px}
#cta{left:576px;top:24px;width:136px;height:40px;font-size:13px}
#legal{left:566px;top:64px;width:156px;text-align:center}
#intro{flex-direction:row;gap:14px}
#intro .ii{width:40px;height:40px}
#intro .il{font-size:24px}
</style>
</head>
<body>
<div id="ad" onclick="window.open(window.clickTag)">
<div id="deco"><svg id="waves" viewBox="0 0 400 40" preserveAspectRatio="none" aria-hidden="true"><path d="M0 20C50 8 100 8 150 20S250 32 300 20 400 8 400 8V40H0Z" fill="rgba(224,169,109,0.16)"/><path d="M0 28C60 18 110 18 170 28S290 38 340 28 400 22 400 22V40H0Z" fill="rgba(127,176,105,0.14)"/></svg></div>
<div id="logo"><span class="mk"><svg class="" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 20h26v8a11 11 0 0 1-11 11h-4A11 11 0 0 1 8 28z"/><path d="M34 22h3a5 5 0 0 1 0 10h-4"/><path d="M16 7c-2 3 2 5 0 8M24 7c-2 3 2 5 0 8"/></svg></span><span class="bn">Ember &amp; Oak</span></div>
<i id="div"></i>
<div id="badge"><b>20%</b><span>1ST ORDER</span></div>
<div id="content"><div id="hl" class="hd">Single-Origin <em>Organic Beans</em></div><p id="sub">Roasted to order, shipped in 48h</p></div>
<div id="cta"><span>Order Fresh</span><i id="shine"></i></div>
<div id="intro"><svg class="ii" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 20h26v8a11 11 0 0 1-11 11h-4A11 11 0 0 1 8 28z"/><path d="M34 22h3a5 5 0 0 1 0 10h-4"/><path d="M16 7c-2 3 2 5 0 8M24 7c-2 3 2 5 0 8"/></svg><div class="it"><span class="il">Roasted</span> <span class="il il2">This Morning</span></div></div>
</div>
<script type="text/javascript">
(function () {
  if (!window.gsap) return; // fallback: the static end frame stays visible
  // 6s loop x 2 plays + 1s pause = 13s total, then rests on the end frame
  gsap.timeline({ repeat: 1, repeatDelay: 1 })
    .set("#intro",{autoAlpha:1},0)
    .from("#deco",{autoAlpha:0,duration:.8},0)
    .to("#waves",{x:87,duration:6,ease:"sine.inOut"},0)
    .from("#intro .ii",{scale:0,rotation:-25,duration:.6,ease:"back.out(2)"},.15)
    .from("#intro .il",{autoAlpha:0,y:18,stagger:.15,duration:.5,ease:"power3.out"},.4)
    .to("#intro",{autoAlpha:0,duration:.35,ease:"power2.in"},2.1)
    .from("#logo",{autoAlpha:0,x:-12,duration:.4},2.35)
    .from("#div",{scaleY:0,duration:.3},2.5)
    .from("#hl",{autoAlpha:0,y:14,duration:.45,ease:"power3.out"},2.6)
    .from("#sub",{autoAlpha:0,y:8,duration:.4},2.85)
    .from("#badge",{scale:0,rotation:-160,duration:.55,ease:"back.out(2)"},3.05)
    .from("#cta",{autoAlpha:0,scale:.6,duration:.45,ease:"back.out(2)"},3.6)
    .to("#cta",{scale:1.06,duration:.25,yoyo:true,repeat:3,ease:"sine.inOut"},4.3)
    .to("#shine",{x:220,duration:.8,ease:"power2.inOut"},4.45)
    .set({},{},6);
})();
</script>
</body>
