<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="ad.size" content="width=160,height=600">
<title>Voltra — Voltra E-Bikes | 160x600</title>
<script type="text/javascript">var clickTag = "https://www.google.com";</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:160px;height:600px;overflow:hidden;background:#0B1220}
#ad{position:relative;width:160px;height:600px;overflow:hidden;cursor:pointer;border:1px solid #333;background:linear-gradient(160deg,#203023 0%,#0B1220 72%);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;color:#F1F5F9;-webkit-font-smoothing:antialiased;user-select:none}
#ad>*{position:absolute}
.hd{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:800;letter-spacing:-.5px;line-height:1.1}
.hd em{font-style:normal;color:#A3E635}
.mk{display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#A3E635,#22D3EE);color:#0B0F19}
.mk svg{width:62%;height:62%}
.bn{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:800;letter-spacing:-.2px;white-space:nowrap}
#sub{color:#9A9FA7}
#cta{z-index:2;display:flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap;border-radius:10px;background:#A3E635;color:#0B0F19;font-weight:700;letter-spacing:.2px;box-shadow:0 6px 16px rgba(163,230,53,0.3)}
#cta span{position:relative;z-index:1}
#shine{position:absolute;left:0;top:-10px;width:30px;height:70px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:translateX(-60px) skewX(-20deg)}
#legal{font-size:8px;line-height:1.3;color:#9A9FA7}
#logo{display:flex;align-items:center;gap:8px}
#num{display:block;font-weight:900;letter-spacing:-1px;line-height:1;color:#A3E635;font-variant-numeric:tabular-nums}
#st span{font-size:10.5px;color:#9A9FA7}
#ch{width:160px;height:120px}
#ch svg{display:block}
#dr{opacity:0}
#logo{left:0;top:22px;width:100%;flex-direction:column;gap:8px}
.mk{width:36px;height:36px;border-radius:10px}
.bn{font-size:13px;text-align:center}
#st{left:0;top:100px;width:100%;text-align:center}
#num{font-size:38px}
#ch{left:0;top:170px}
#ct{left:14px;top:312px;width:132px}
#hl{font-size:18px}
#sub{margin-top:8px;font-size:11px;line-height:1.45}
.fl{margin-top:14px}
#cta{left:14px;bottom:48px;width:132px;height:40px;font-size:12px}
#legal{left:10px;bottom:16px;width:140px;text-align:center}
.fl{list-style:none;display:grid;gap:9px}
.fl li{display:flex;align-items:flex-start;gap:7px;font-size:10.5px;line-height:1.3}
.fl svg{flex:0 0 12px;width:12px;height:12px;margin-top:1px;color:#A3E635}
</style>
</head>
<body>
<div id="ad" onclick="window.open(window.clickTag)">
<div id="logo"><span class="mk"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="33" r="7"/><circle cx="37" cy="33" r="7"/><path d="M11 33l8-14h12l6 14M19 19l5 14h-13M29 12h5l-3 7"/><path d="M24 10l-3 6h5l-3 6"/></svg></span><span class="bn">Voltra</span></div>
<div id="ch"><svg width="160" height="120" viewBox="0 0 160 120" aria-hidden="true"><defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A3E635" stop-opacity=".35"/><stop offset="1" stop-color="#A3E635" stop-opacity="0"/></linearGradient></defs><path d="M0 30H160" stroke="rgba(241,245,249,0.08)" stroke-dasharray="3 5"/><path d="M0 60H160" stroke="rgba(241,245,249,0.08)" stroke-dasharray="3 5"/><path d="M0 90H160" stroke="rgba(241,245,249,0.08)" stroke-dasharray="3 5"/><path id="ar" d="M0.0 91.7L20.0 79.0L40.0 79.6L60.0 60.6L80.0 56.4L100.0 39.6L120.0 42.0L140.0 18.7L154.0 19.5L154.0 120L0 120Z" fill="url(#ag)"/><path id="ln" d="M0.0 91.7L20.0 79.0L40.0 79.6L60.0 60.6L80.0 56.4L100.0 39.6L120.0 42.0L140.0 18.7L154.0 19.5" fill="none" stroke="#A3E635" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="0"/><circle id="dr" cx="154.0" cy="19.5" r="4" fill="none" stroke="#A3E635" stroke-width="1.5"/><circle id="dt" cx="154.0" cy="19.5" r="4" fill="#A3E635"/></svg></div>
<div id="st"><b id="num">120km</b><span>range per charge</span></div>
<div id="ct"><div id="hl" class="hd">E-Bikes<br><em>Built to Go</em></div><p id="sub">Test ride at a store near you</p><ul class="fl"><li><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6.5 5 9l5-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>120km range</span></li><li><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6.5 5 9l5-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Folds in 10 seconds</span></li><li><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6.5 5 9l5-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>2-year warranty</span></li></ul></div>
<div id="cta"><span>Book Test Ride</span><i id="shine"></i></div>
</div>
<script type="text/javascript">
(function () {
  if (!window.gsap) return; // fallback: the static end frame stays visible
  var N={v:0},E=document.getElementById("num");function F(v){return ""+v.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g,",")+"km"}
  // 6s loop x 2 plays + 1s pause = 13s total, then rests on the end frame
  gsap.timeline({ repeat: 1, repeatDelay: 1 })
    .from("#logo",{autoAlpha:0,duration:.4},0)
    .from("#st",{autoAlpha:0,y:10,duration:.35},.2)
    .fromTo(N,{v:0},{v:120,duration:1.5,ease:"power2.out",onUpdate:function(){E.textContent=F(N.v)}},.2)
    .fromTo("#ln",{attr:{"stroke-dashoffset":1}},{attr:{"stroke-dashoffset":0},duration:1.5,ease:"power2.inOut"},.3)
    .from("#ar",{autoAlpha:0,duration:.8},1.2)
    .from("#dt",{scale:0,transformOrigin:"50% 50%",duration:.35,ease:"back.out(3)"},1.75)
    .fromTo("#dr",{scale:1,autoAlpha:.9,transformOrigin:"50% 50%"},{scale:3.2,autoAlpha:0,duration:1,repeat:1,immediateRender:false},2)
    .from("#hl",{autoAlpha:0,y:12,duration:.45,ease:"power3.out"},2.3)
    .from("#sub",{autoAlpha:0,duration:.4},2.55)
    .from(".fl li",{autoAlpha:0,x:-10,stagger:.15,duration:.35},2.7)
    .from("#cta",{autoAlpha:0,scale:.6,duration:.45,ease:"back.out(2)"},3.2)
    .to("#cta",{scale:1.06,duration:.25,yoyo:true,repeat:3,ease:"sine.inOut"},4.3)
    .to("#shine",{x:220,duration:.8,ease:"power2.inOut"},4.45)
    .set({},{},6);
})();
</script>
</body>
</html>
