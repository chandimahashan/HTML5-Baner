<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="ad.size" content="width=160,height=600">
<title>Foundry Lofts — Urban Loft Living | 160x600</title>
<script type="text/javascript">var clickTag = "https://www.google.com";</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:160px;height:600px;overflow:hidden;background:#121212}
#ad{position:relative;width:160px;height:600px;overflow:hidden;cursor:pointer;border:1px solid #333;background:linear-gradient(135deg,#1F1B19 0%,#121212 100%);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;color:#FAFAF9;-webkit-font-smoothing:antialiased;user-select:none}
#ad>*,#deco>*{position:absolute}
#deco{inset:0;overflow:hidden}
#stripes{left:-40px;top:0;width:calc(100% + 80px);height:100%;background:repeating-linear-gradient(135deg,rgba(249,115,22,0.08) 0 2px,transparent 2px 14px)}
.hd{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:800;letter-spacing:-.5px;line-height:1.1}
.hd em{font-style:normal;color:#F97316}
#logo{display:flex;align-items:center;gap:8px}
.mk{display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#F97316,#FDBA74);color:#121212}
.mk svg{width:62%;height:62%}
.bn{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:800;letter-spacing:-.2px;white-space:nowrap}
#div{background:linear-gradient(180deg,transparent,rgba(249,115,22,0.5),transparent)}
#hero{display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(249,115,22,0.12);border:1px solid rgba(249,115,22,0.35);color:#F97316}
#hero svg{width:56%;height:56%}
#badge{z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:50%;transform:rotate(10deg);background:#FDBA74;color:#121212;box-shadow:0 6px 16px rgba(253,186,116,0.4)}
#badge::before{content:"";position:absolute;inset:3px;border-radius:50%;border:1px dashed currentColor;opacity:.45}
#badge b{font-weight:900;line-height:1}
#badge span{margin-top:2px;font-size:6.5px;font-weight:800;letter-spacing:.8px}
#sub{color:#A8A29E}
#cta{z-index:2;display:flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap;border-radius:4px;background:#F97316;color:#121212;font-weight:700;letter-spacing:.2px;box-shadow:0 6px 16px rgba(249,115,22,0.3)}
#cta span{position:relative;z-index:1}
#shine{position:absolute;left:0;top:-10px;width:30px;height:70px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:translateX(-60px) skewX(-20deg)}
#legal{font-size:8px;line-height:1.3;color:#A8A29E}
#intro{inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;visibility:hidden}
#intro .ii{color:#F97316}
#intro .il{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:900;letter-spacing:-.8px;line-height:1.05}
#intro .il2{color:#F97316;}

#logo{left:0;top:22px;width:100%;flex-direction:column;gap:8px}
.mk{width:40px;height:40px;border-radius:11px}
.bn{font-size:13px;text-align:center}
#hero{left:38px;top:136px;width:84px;height:84px}
#badge{right:8px;top:118px;width:54px;height:54px}
#badge b{font-size:15px}
#content{left:14px;top:256px;width:132px}
#hl{font-size:18px}
#sub{margin-top:10px;font-size:11px;line-height:1.45}
#rule{width:24px;height:2px;margin:16px 0;background:#F97316}
#feats{list-style:none;display:grid;gap:12px}
.feat{display:flex;align-items:flex-start;gap:7px;font-size:11px;line-height:1.3}
.feat svg{flex:0 0 12px;width:12px;height:12px;margin-top:1px;color:#F97316}
#cta{left:14px;bottom:48px;width:132px;height:40px;font-size:12px}
#legal{left:10px;bottom:16px;width:140px;text-align:center}
#intro{padding:0 14px}
#intro .ii{width:64px;height:64px}
#intro .il{display:block;font-size:22px}
</style>
</head>
<body>
<div id="ad" onclick="window.open(window.clickTag)">
<div id="deco"><i id="stripes"></i></div>
<div id="logo"><span class="mk"><svg class="" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="9" width="32" height="35" rx="1"/><path d="M8 18h32M8 27h32M16 9v9M32 18v9M24 27v9"/><path d="M20 44v-8h8v8"/></svg></span><span class="bn">Foundry Lofts</span></div>
<div id="hero"><svg class="" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="9" width="32" height="35" rx="1"/><path d="M8 18h32M8 27h32M16 9v9M32 18v9M24 27v9"/><path d="M20 44v-8h8v8"/></svg></div>
<div id="badge"><b>1 MO</b><span>FREE RENT</span></div>
<div id="content"><div id="hl" class="hd">Urban Loft<br><em>Living</em></div><p id="sub">Exposed brick, 14ft ceilings, downtown</p><i id="rule" style="display:block"></i><ul id="feats"><li class="feat"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6.5 5 9l5-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>14ft ceilings</span></li><li class="feat"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6.5 5 9l5-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Rooftop lounge</span></li><li class="feat"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6.5 5 9l5-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Steps from transit</span></li></ul></div>
<div id="cta"><span>View Floor Plans</span><i id="shine"></i></div>
<div id="intro"><svg class="ii" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="9" width="32" height="35" rx="1"/><path d="M8 18h32M8 27h32M16 9v9M32 18v9M24 27v9"/><path d="M20 44v-8h8v8"/></svg><div class="it"><span class="il">Industrial</span> <span class="il il2">Soul</span></div></div>
</div>
<script type="text/javascript">
(function () {
  if (!window.gsap) return; // fallback: the static end frame stays visible
  // 6s loop x 2 plays + 1s pause = 13s total, then rests on the end frame
  gsap.timeline({ repeat: 1, repeatDelay: 1 })
    .set("#intro",{autoAlpha:1},0)
    .from("#deco",{autoAlpha:0,duration:.8},0)
    .to("#stripes",{x:40,duration:6,ease:"none"},0)
    .from("#intro .ii",{scale:0,rotation:-25,duration:.6,ease:"back.out(2)"},.15)
    .from("#intro .il",{autoAlpha:0,y:18,stagger:.15,duration:.5,ease:"power3.out"},.4)
    .to("#intro",{autoAlpha:0,duration:.35,ease:"power2.in"},2.1)
    .from("#logo",{autoAlpha:0,y:-10,duration:.4},2.35)
    .from("#hero",{scale:0,autoAlpha:0,duration:.55,ease:"back.out(1.8)"},2.45)
    .from("#hl",{autoAlpha:0,y:14,duration:.45,ease:"power3.out"},2.6)
    .from("#sub",{autoAlpha:0,y:8,duration:.4},2.85)
    .from("#rule",{scaleX:0,transformOrigin:"left center",duration:.4},3)
    .from(".feat",{autoAlpha:0,x:-10,stagger:.15,duration:.35},3.1)
    .from("#badge",{scale:0,rotation:-160,duration:.55,ease:"back.out(2)"},3.05)
    .from("#cta",{autoAlpha:0,scale:.6,duration:.45,ease:"back.out(2)"},3.6)
    .to("#cta",{scale:1.06,duration:.25,yoyo:true,repeat:3,ease:"sine.inOut"},4.3)
    .to("#shine",{x:220,duration:.8,ease:"power2.inOut"},4.45)
    .set({},{},6);
})();
</script>
</body>
</html>
