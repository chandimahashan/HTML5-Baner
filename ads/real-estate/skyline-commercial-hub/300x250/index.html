<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="ad.size" content="width=300,height=250">
<title>Skyline Hub — Skyline Commercial Hub | 300x250</title>
<script type="text/javascript">var clickTag = "https://www.google.com";</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:300px;height:250px;overflow:hidden;background:#0F172A}
#ad{position:relative;width:300px;height:250px;overflow:hidden;cursor:pointer;border:1px solid #333;background:linear-gradient(160deg,#1E293B 0%,#0F172A 100%);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;color:#F8FAFC;-webkit-font-smoothing:antialiased;user-select:none}
#ad>*,#deco>*{position:absolute}
#deco{inset:0;overflow:hidden}
#grid{left:0;top:-24px;width:100%;height:calc(100% + 48px);background-image:linear-gradient(rgba(96,165,250,0.12) 1px,transparent 1px),linear-gradient(90deg,rgba(96,165,250,0.12) 1px,transparent 1px);background-size:24px 24px;-webkit-mask-image:radial-gradient(ellipse at 75% 25%,#000,transparent 75%);mask-image:radial-gradient(ellipse at 75% 25%,#000,transparent 75%)}
.hd{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:800;letter-spacing:-.5px;line-height:1.1}
.hd em{font-style:normal;color:#60A5FA}
#logo{display:flex;align-items:center;gap:8px}
.mk{display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#60A5FA,#BFDBFE);color:#0F172A}
.mk svg{width:62%;height:62%}
.bn{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:800;letter-spacing:-.2px;white-space:nowrap}
#div{background:linear-gradient(180deg,transparent,rgba(96,165,250,0.5),transparent)}
#hero{display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(96,165,250,0.12);border:1px solid rgba(96,165,250,0.35);color:#60A5FA}
#hero svg{width:56%;height:56%}
#badge{z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:50%;transform:rotate(10deg)}
#badge::before{content:"";position:absolute;inset:3px;border-radius:50%;border:1px dashed currentColor;opacity:.45}
#badge b{font-weight:900;line-height:1}
#badge span{margin-top:2px;font-size:6.5px;font-weight:800;letter-spacing:.8px}
#sub{color:#94A3B8}
#cta{z-index:2;display:flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap;border-radius:6px;background:#60A5FA;color:#0B1220;font-weight:700;letter-spacing:.2px;box-shadow:0 6px 16px rgba(96,165,250,0.3)}
#cta span{position:relative;z-index:1}
#shine{position:absolute;left:0;top:-10px;width:30px;height:70px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:translateX(-60px) skewX(-20deg)}
#legal{font-size:8px;line-height:1.3;color:#94A3B8}
#intro{inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;visibility:hidden}
#intro .ii{color:#60A5FA}
#intro .il{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:900;letter-spacing:-.8px;line-height:1.05}
#intro .il2{color:#60A5FA;}

#logo{left:14px;top:12px}
.mk{width:24px;height:24px;border-radius:6px}
.bn{font-size:13px}
#badge{right:10px;top:10px;width:58px;height:58px}
#badge b{font-size:17px}
#hero{left:204px;top:66px;width:80px;height:80px}
#content{left:16px;top:56px;width:184px}
#hl{font-size:21px}
#sub{margin-top:8px;font-size:11.5px;line-height:1.4}
#cta{left:16px;bottom:16px;height:36px;padding:0 20px;font-size:13px}
#legal{right:12px;bottom:8px;max-width:108px;text-align:right}
#intro .ii{width:56px;height:56px}
#intro .il{display:block;font-size:28px}
</style>
</head>
<body>
<div id="ad" onclick="window.open(window.clickTag)">
<div id="deco"><i id="grid"></i></div>
<div id="logo"><span class="mk"><svg class="" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 44h40"/><path d="M8 44V22h10v22M18 44V7h12v37M30 44V15h10v29"/><path d="M22 13h4M22 20h4M22 27h4"/></svg></span><span class="bn">Skyline Hub</span></div>
<div id="hero"><svg class="" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 44h40"/><path d="M8 44V22h10v22M18 44V7h12v37M30 44V15h10v29"/><path d="M22 13h4M22 20h4M22 27h4"/></svg></div>
<div id="content"><div id="hl" class="hd">Grade-A<br><em>Office Space</em></div><p id="sub">Flexible floors from 2,000 sq ft</p></div>
<div id="cta"><span>Schedule a Tour</span><i id="shine"></i></div>
<div id="intro"><svg class="ii" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 44h40"/><path d="M8 44V22h10v22M18 44V7h12v37M30 44V15h10v29"/><path d="M22 13h4M22 20h4M22 27h4"/></svg><div class="it"><span class="il">Your Next HQ</span> <span class="il il2">Awaits</span></div></div>
</div>
<script type="text/javascript">
(function () {
  if (!window.gsap) return; // fallback: the static end frame stays visible
  // 6s loop x 2 plays + 1s pause = 13s total, then rests on the end frame
  gsap.timeline({ repeat: 1, repeatDelay: 1 })
    .set("#intro",{autoAlpha:1},0)
    .from("#deco",{autoAlpha:0,duration:.8},0)
    .to("#grid",{y:24,duration:6,ease:"none"},0)
    .from("#intro .ii",{scale:0,rotation:-25,duration:.6,ease:"back.out(2)"},.15)
    .from("#intro .il",{autoAlpha:0,y:18,stagger:.15,duration:.5,ease:"power3.out"},.4)
    .to("#intro",{autoAlpha:0,duration:.35,ease:"power2.in"},2.1)
    .from("#logo",{autoAlpha:0,x:-12,duration:.4},2.35)
    .from("#hero",{scale:0,autoAlpha:0,duration:.55,ease:"back.out(1.8)"},2.45)
    .from("#hl",{autoAlpha:0,y:14,duration:.45,ease:"power3.out"},2.6)
    .from("#sub",{autoAlpha:0,y:8,duration:.4},2.85)
    .from("#cta",{autoAlpha:0,scale:.6,duration:.45,ease:"back.out(2)"},3.6)
    .to("#cta",{scale:1.06,duration:.25,yoyo:true,repeat:3,ease:"sine.inOut"},4.3)
    .to("#shine",{x:220,duration:.8,ease:"power2.inOut"},4.45)
    .set({},{},6);
})();
</script>
</body>
</html>
