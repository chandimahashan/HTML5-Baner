<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="ad.size" content="width=160,height=600">
<title>Palazzo — Palazzo Heritage Residences | 160x600</title>
<script type="text/javascript">var clickTag = "https://www.google.com";</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:160px;height:600px;overflow:hidden;background:#1A1410}
#ad{position:relative;width:160px;height:600px;overflow:hidden;cursor:pointer;border:1px solid #333;background:linear-gradient(160deg,#342A1D 0%,#1A1410 72%);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;color:#F5E6C4;-webkit-font-smoothing:antialiased;user-select:none}
#ad>*{position:absolute}
.hd{font-family:Georgia,"Times New Roman",serif;font-weight:400;letter-spacing:0;line-height:1.1}
.hd em{font-style:italic;color:#D6B370}
.mk{display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#D6B370,#F5E6C4);color:#0B0F19}
.mk svg{width:62%;height:62%}
.bn{font-family:Georgia,"Times New Roman",serif;font-weight:400;letter-spacing:.5px;white-space:nowrap}
#sub{color:#A29680}
#cta{z-index:2;display:flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap;border-radius:2px;background:#D6B370;color:#0B0F19;font-weight:700;letter-spacing:.2px;box-shadow:0 6px 16px rgba(214,179,112,0.3)}
#cta span{position:relative;z-index:1}
#shine{position:absolute;left:0;top:-10px;width:30px;height:70px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:translateX(-60px) skewX(-20deg)}
#legal{font-size:8px;line-height:1.3;color:#A29680}
#rays{border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(214,179,112,0.22) 0deg 7deg,transparent 7deg 20deg);-webkit-mask-image:radial-gradient(circle,#000 18%,transparent 68%);mask-image:radial-gradient(circle,#000 18%,transparent 68%)}
#glow{border-radius:50%;background:radial-gradient(circle,rgba(245,230,196,0.45),transparent 65%)}
#pod{border-radius:50%;background:radial-gradient(ellipse,rgba(214,179,112,0.55),transparent 70%)}
#hero{color:#D6B370;filter:drop-shadow(0 0 8px rgba(214,179,112,0.6))}
#hero svg{width:100%;height:100%}
.pt{width:4px;height:4px;border-radius:50%;background:#F5E6C4}
#bn{font-weight:800;letter-spacing:3px;text-transform:uppercase;color:#D6B370}
#it{font-family:Georgia,"Times New Roman",serif;font-weight:400;letter-spacing:0;line-height:1.1;visibility:hidden}
#it em{font-style:italic;color:#D6B370}
#rays{left:-60px;top:10px;width:280px;height:280px}
#glow{left:10px;top:80px;width:140px;height:140px}
#hero{left:42px;top:112px;width:76px;height:76px}
#pod{left:15px;top:189px;width:130px;height:18px}
#p0{left:26px;top:175px}
#p1{left:129px;top:162px}
#p2{left:51px;top:143px}
#p3{left:117px;top:187px}
#p4{left:70px;top:192px}
#p5{left:144px;top:138px}
#bn{left:0;top:26px;width:100%;text-align:center;font-size:10px}
#it,#ct{left:14px;top:246px;width:132px;text-align:center}
#it{font-size:24px}
#hl{font-size:19px}
#sub{margin-top:10px;font-size:11px;line-height:1.45}
.fl{margin:16px auto 0;width:max-content;max-width:132px;text-align:left}
#cta{left:14px;bottom:48px;width:132px;height:40px;font-size:12px}
#legal{left:10px;bottom:16px;width:140px;text-align:center}
.fl{list-style:none;display:grid;gap:9px}
.fl li{display:flex;align-items:flex-start;gap:7px;font-size:10.5px;line-height:1.3}
.fl svg{flex:0 0 12px;width:12px;height:12px;margin-top:1px;color:#D6B370}
</style>
</head>
<body>
<div id="ad" onclick="window.open(window.clickTag)">
<div id="rays"></div>
<div id="glow"></div>
<div id="pod"></div>
<i id="p0" class="pt"></i>
<i id="p1" class="pt"></i>
<i id="p2" class="pt"></i>
<i id="p3" class="pt"></i>
<i id="p4" class="pt"></i>
<i id="p5" class="pt"></i>
<div id="hero"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 16L24 6l20 10z"/><path d="M4 42h40M8 38h32"/><path d="M11 20v18M19 20v18M29 20v18M37 20v18"/></svg></div>
<span id="bn">Palazzo</span>
<div id="it">History,<br><em>Restored</em></div>
<div id="ct"><div id="hl" class="hd">Heritage<br><em>Residences</em></div><p id="sub">Restored 1890s landmark apartments</p><ul class="fl"><li><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6.5 5 9l5-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Original frescoes</span></li><li><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6.5 5 9l5-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Concierge &amp; valet</span></li><li><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6.5 5 9l5-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Private courtyard</span></li></ul></div>
<div id="cta"><span>Private Viewing</span><i id="shine"></i></div>
</div>
<script type="text/javascript">
(function () {
  if (!window.gsap) return; // fallback: the static end frame stays visible
  // 6s loop x 2 plays + 1s pause = 13s total, then rests on the end frame
  gsap.timeline({ repeat: 1, repeatDelay: 1 })
    .from("#glow",{scale:.3,autoAlpha:0,duration:1,ease:"power2.out"},0)
    .from("#rays",{scale:.4,autoAlpha:0,duration:1.2,ease:"power2.out"},0)
    .to("#rays",{rotation:45,duration:6,ease:"none"},0)
    .from("#hero",{y:-50,scale:.5,autoAlpha:0,duration:.8,ease:"bounce.out"},.2)
    .from("#pod",{scaleX:0,autoAlpha:0,duration:.5},.6)
    .fromTo(".pt",{y:14,autoAlpha:0},{y:-22,autoAlpha:1,duration:.9,stagger:.2,yoyo:true,repeat:1,ease:"sine.out"},.5)
    .from("#bn",{autoAlpha:0,letterSpacing:"10px",duration:.6},.3)
    .fromTo("#it",{autoAlpha:0,y:12},{autoAlpha:1,y:0,duration:.45},.7)
    .to("#it",{autoAlpha:0,y:-10,duration:.3},2)
    .from("#hl",{autoAlpha:0,y:12,duration:.45,ease:"power3.out"},2.3)
    .from("#sub",{autoAlpha:0,duration:.4},2.55)
    .from(".fl li",{autoAlpha:0,x:-10,stagger:.15,duration:.35},2.75)
    .from("#cta",{autoAlpha:0,scale:.6,duration:.45,ease:"back.out(2)"},3.1)
    .to("#cta",{scale:1.06,duration:.25,yoyo:true,repeat:3,ease:"sine.inOut"},4.3)
    .to("#shine",{x:220,duration:.8,ease:"power2.inOut"},4.45)
    .set({},{},6);
})();
</script>
</body>
</html>
