<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="ad.size" content="width=160,height=600">
<title>CodeNest — CodeNest Dev Platform | 160x600</title>
<script type="text/javascript">var clickTag = "https://www.google.com";</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:160px;height:600px;overflow:hidden;background:#030712}
#ad{position:relative;width:160px;height:600px;overflow:hidden;cursor:pointer;border:1px solid #333;background:linear-gradient(160deg,#07221D 0%,#030712 72%);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;color:#ECFDF5;-webkit-font-smoothing:antialiased;user-select:none}
#ad>*{position:absolute}
.hd{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:800;letter-spacing:-.5px;line-height:1.1}
.hd em{font-style:normal;color:#22C55E}
.mk{display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#22C55E,#A3E635);color:#FFFFFF}
.mk svg{width:62%;height:62%}
.bn{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:800;letter-spacing:-.2px;white-space:nowrap}
#sub{color:#93A09F}
#cta{z-index:2;display:flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap;border-radius:10px;background:#22C55E;color:#FFFFFF;font-weight:700;letter-spacing:.2px;box-shadow:0 6px 16px rgba(34,197,94,0.3)}
#cta span{position:relative;z-index:1}
#shine{position:absolute;left:0;top:-10px;width:30px;height:70px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:translateX(-60px) skewX(-20deg)}
#legal{font-size:8px;line-height:1.3;color:#93A09F}
#scan{inset:0;z-index:7;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px)}
#sw{left:0;top:0;width:100%;height:25%;z-index:7;pointer-events:none;background:linear-gradient(180deg,transparent,rgba(34,197,94,0.1),transparent);transform:translateY(400%)}
#nf{border:1.5px solid #22C55E;box-shadow:0 0 6px #22C55E,0 0 14px rgba(34,197,94,0.5),inset 0 0 8px rgba(34,197,94,0.45)}
#g{inset:0;z-index:5;display:grid;place-items:center;visibility:hidden}
.gl{grid-area:1/1;text-align:center;font-size:34px;font-weight:900;line-height:1;text-transform:uppercase;letter-spacing:1px}
.g0{color:#fff;text-shadow:0 0 3px #fff,0 0 8px #22C55E,0 0 18px #22C55E,0 0 30px rgba(34,197,94,0.6)}
.g1{color:#A3E635;opacity:.8}
.g2{color:#22C55E;opacity:.8}
#bn{color:#fff;font-weight:800;letter-spacing:3px;text-transform:uppercase;text-shadow:0 0 3px #fff,0 0 8px #A3E635,0 0 18px #A3E635,0 0 30px rgba(163,230,53,0.6)}
#hero{color:#22C55E;filter:drop-shadow(0 0 4px #22C55E) drop-shadow(0 0 10px #22C55E)}
#hero svg{width:100%;height:100%}
#hl{color:#fff;font-weight:800;line-height:1.1;letter-spacing:-.3px;text-shadow:0 0 3px #fff,0 0 8px #22C55E,0 0 18px #22C55E,0 0 30px rgba(34,197,94,0.6)}
#hl em{font-style:normal;text-shadow:0 0 3px #fff,0 0 8px #A3E635,0 0 18px #A3E635,0 0 30px rgba(163,230,53,0.6)}
.fl li{color:#fff}
#of{padding:3px 8px;border:1px solid #22C55E;border-radius:4px;color:#22C55E;font-size:10px;font-weight:800;letter-spacing:1px;text-shadow:0 0 6px #22C55E;box-shadow:0 0 8px rgba(34,197,94,0.5)}
#cta{background:transparent;border:1.5px solid #A3E635;color:#fff;text-shadow:0 0 6px #A3E635;box-shadow:0 0 10px rgba(163,230,53,0.6),inset 0 0 10px rgba(163,230,53,0.4)}
#legal{z-index:8}
#nf{left:7px;top:7px;right:7px;bottom:7px;border-radius:10px}
#bn{left:0;top:28px;width:100%;text-align:center;font-size:12px}
#hero{left:40px;top:64px;width:80px;height:80px}
#hl{left:14px;top:170px;width:132px;text-align:center;font-size:19px}
#sub{left:14px;top:250px;width:132px;text-align:center;font-size:11px;line-height:1.45}
.fl{left:20px;top:310px;width:124px}
#of{left:30px;top:410px;width:100px;text-align:center}
#cta{left:16px;bottom:52px;width:128px;height:40px;font-size:12px}
#legal{left:10px;bottom:20px;width:140px;text-align:center}
.fl{list-style:none;display:grid;gap:12px}
.fl li{display:flex;align-items:flex-start;gap:7px;font-size:10.5px;line-height:1.3}
.fl svg{flex:0 0 12px;width:12px;height:12px;margin-top:1px;color:#A3E635}
</style>
</head>
<body>
<div id="ad" onclick="window.open(window.clickTag)">
<div id="nf"></div>
<div id="hero"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 14L6 24l10 10M32 14l10 10-10 10M27 8l-6 32"/></svg></div>
<span id="bn">CodeNest</span>
<div id="hl">Deploy in<br><em>One Click</em></div>
<p id="sub">Preview URLs for every branch</p>
<ul class="fl"><li><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6.5 5 9l5-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Global edge network</span></li><li><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6.5 5 9l5-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Instant rollbacks</span></li><li><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6.5 5 9l5-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Free SSL</span></li></ul>
<div id="cta"><span>Deploy Free</span><i id="shine"></i></div>
<div id="g"><span class="gl g1">git push<br>→ Live</span><span class="gl g2">git push<br>→ Live</span><span class="gl g0">git push<br>→ Live</span></div>
<div id="sw"></div>
<div id="scan"></div>
</div>
<script type="text/javascript">
(function () {
  if (!window.gsap) return; // fallback: the static end frame stays visible
  // 6s loop x 2 plays + 1s pause = 13s total, then rests on the end frame
  gsap.timeline({ repeat: 1, repeatDelay: 1 })
    .fromTo("#nf",{autoAlpha:0},{autoAlpha:1,duration:.06,repeat:4,yoyo:true,repeatDelay:.07,ease:"none"},.05)
    .fromTo("#sw",{yPercent:-100},{yPercent:400,duration:2.2,repeat:1,ease:"none"},0)
    .set("#g",{autoAlpha:1},.35)
    .from(".g0",{autoAlpha:0,duration:.05,repeat:4,yoyo:true},.35)
    .to(".g1",{x:4,y:-1,duration:.05,repeat:11,yoyo:true,ease:"none"},.4)
    .to(".g2",{x:-4,y:1,duration:.05,repeat:11,yoyo:true,ease:"none"},.4)
    .to(".g1",{x:-5,duration:.04,repeat:7,yoyo:true,ease:"none"},1.4)
    .to(".g2",{x:5,duration:.04,repeat:7,yoyo:true,ease:"none"},1.4)
    .to("#g",{skewX:30,autoAlpha:0,duration:.15},1.95)
    .fromTo("#hero",{autoAlpha:0},{autoAlpha:1,duration:.05,repeat:4,yoyo:true,repeatDelay:.05},2.1)
    .fromTo("#bn",{autoAlpha:0},{autoAlpha:1,duration:.3},2.2)
    .fromTo("#hl",{autoAlpha:0},{autoAlpha:1,duration:.05,repeat:6,yoyo:true,repeatDelay:.04},2.35)
    .from("#sub",{autoAlpha:0,duration:.4},2.8)
    .from(".fl li",{autoAlpha:0,x:-10,stagger:.15,duration:.35},3)
    .fromTo("#cta",{autoAlpha:0},{autoAlpha:1,duration:.05,repeat:4,yoyo:true,repeatDelay:.06},3.3)
    .to("#cta",{scale:1.06,duration:.25,yoyo:true,repeat:3,ease:"sine.inOut"},4.3)
    .to("#shine",{x:220,duration:.8,ease:"power2.inOut"},4.45)
    .set({},{},6);
})();
</script>
</body>
</html>
