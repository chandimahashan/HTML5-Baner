<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="ad.size" content="width=300,height=250">
<title>Stackly — Stackly No-Code | 300x250</title>
<script type="text/javascript">var clickTag = "https://www.google.com";</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:300px;height:250px;overflow:hidden;background:#FFFFFF}
#ad{position:relative;width:300px;height:250px;overflow:hidden;cursor:pointer;border:1px solid #e2e8f0;background:linear-gradient(160deg,#F3F2FD 0%,#FFFFFF 72%);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;color:#111827;-webkit-font-smoothing:antialiased;user-select:none}
#ad>*{position:absolute}
.hd{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:800;letter-spacing:-.5px;line-height:1.1}
.hd em{font-style:normal;color:#4F46E5}
.mk{display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#4F46E5,#10B981);color:#FFFFFF}
.mk svg{width:62%;height:62%}
.bn{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:800;letter-spacing:-.2px;white-space:nowrap}
#sub{color:#6B7079}
#cta{z-index:2;display:flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap;border-radius:10px;background:#4F46E5;color:#FFFFFF;font-weight:700;letter-spacing:.2px;box-shadow:0 6px 16px rgba(79,70,229,0.3)}
#cta span{position:relative;z-index:1}
#shine{position:absolute;left:0;top:-10px;width:30px;height:70px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:translateX(-60px) skewX(-20deg)}
#legal{font-size:8px;line-height:1.3;color:#6B7079}
#logo{display:flex;align-items:center;gap:8px}
#num{display:block;font-weight:900;letter-spacing:-1px;line-height:1;color:#4F46E5;font-variant-numeric:tabular-nums}
#st span{font-size:10.5px;color:#6B7079}
#ch{width:300px;height:100px}
#ch svg{display:block}
#dr{opacity:0}
#logo{left:14px;top:12px}
.mk{width:22px;height:22px;border-radius:6px}
.bn{font-size:12.5px}
#st{left:16px;top:38px}
#num{font-size:34px}
#ct{left:16px;top:96px;width:268px}
#hl{font-size:18px}
#ch{left:0;bottom:0}
#cta{left:16px;bottom:14px;height:32px;padding:0 18px;font-size:12.5px}
#legal{right:12px;bottom:6px;max-width:130px;text-align:right}
</style>
</head>
<body>
<div id="ad" onclick="window.open(window.clickTag)">
<div id="logo"><span class="mk"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="6" width="15" height="15" rx="3"/><rect x="27" y="6" width="15" height="15" rx="3"/><rect x="6" y="27" width="15" height="15" rx="3"/><path d="M34.5 27v15M27 34.5h15"/></svg></span><span class="bn">Stackly</span></div>
<div id="ch"><svg width="300" height="100" viewBox="0 0 300 100" aria-hidden="true"><path d="M0 25H300" stroke="rgba(17,24,39,0.08)" stroke-dasharray="3 5"/><path d="M0 50H300" stroke="rgba(17,24,39,0.08)" stroke-dasharray="3 5"/><path d="M0 75H300" stroke="rgba(17,24,39,0.08)" stroke-dasharray="3 5"/><rect class="br" x="15.0" y="80.7" width="25.7" height="19.3" rx="2" fill="rgba(79,70,229,0.38)"/><rect class="br" x="55.7" y="63.9" width="25.7" height="36.1" rx="2" fill="rgba(79,70,229,0.38)"/><rect class="br" x="96.4" y="53.7" width="25.7" height="46.3" rx="2" fill="rgba(79,70,229,0.38)"/><rect class="br" x="137.1" y="52.8" width="25.7" height="47.2" rx="2" fill="rgba(79,70,229,0.38)"/><rect class="br" x="177.9" y="42.8" width="25.7" height="57.2" rx="2" fill="rgba(79,70,229,0.38)"/><rect class="br" x="218.6" y="23.8" width="25.7" height="76.2" rx="2" fill="rgba(79,70,229,0.38)"/><rect class="br" x="259.3" y="11.7" width="25.7" height="88.3" rx="2" fill="#4F46E5"/></svg></div>
<div id="st"><b id="num">10x</b><span>faster app builds</span></div>
<div id="ct"><div id="hl" class="hd">No-Code<br><em>App Builder</em></div></div>
<div id="cta"><span>Build Free</span><i id="shine"></i></div>
</div>
<script type="text/javascript">
(function () {
  if (!window.gsap) return; // fallback: the static end frame stays visible
  var N={v:0},E=document.getElementById("num");function F(v){return ""+v.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g,",")+"x"}
  // 6s loop x 2 plays + 1s pause = 13s total, then rests on the end frame
  gsap.timeline({ repeat: 1, repeatDelay: 1 })
    .from("#logo",{autoAlpha:0,duration:.4},0)
    .from("#st",{autoAlpha:0,y:10,duration:.35},.2)
    .fromTo(N,{v:0},{v:10,duration:1.5,ease:"power2.out",onUpdate:function(){E.textContent=F(N.v)}},.2)
    .from(".br",{scaleY:0,transformOrigin:"50% 100%",stagger:.1,duration:.5,ease:"power3.out"},.3)
    .from("#hl",{autoAlpha:0,y:12,duration:.45,ease:"power3.out"},2.3)
    .from("#cta",{autoAlpha:0,scale:.6,duration:.45,ease:"back.out(2)"},3.2)
    .to("#cta",{scale:1.06,duration:.25,yoyo:true,repeat:3,ease:"sine.inOut"},4.3)
    .to("#shine",{x:220,duration:.8,ease:"power2.inOut"},4.45)
    .set({},{},6);
})();
</script>
</body>
</html>
