<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="ad.size" content="width=160,height=600">
<title>Stackly — Stackly No-Code | 160x600</title>
<script type="text/javascript">var clickTag = "https://www.google.com";</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:160px;height:600px;overflow:hidden;background:#FFFFFF}
#ad{position:relative;width:160px;height:600px;overflow:hidden;cursor:pointer;border:1px solid #e2e8f0;background:linear-gradient(160deg,#F3F2FD 0%,#FFFFFF 72%);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;color:#111827;-webkit-font-smoothing:antialiased;user-select:none}
#ad>*{position:absolute}
.hd{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:800;letter-spacing:-.5px;line-height:1.1}
.hd em{font-style:normal;color:#4F46E5}
.mk{display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#4F46E5,#10B981);color:#FFFFFF}
.mk svg{width:62%;height:62%}
.bn{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:800;letter-spacing:-.2px;white-space:nowrap}
#sub{color:#6B7079}
#cta{z-index:2;display:flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap;border-radius:10px;background:#4F46E5;color:#FFFFFF;font-weight:700;letter-spacing:.2px;box-shadow:0 6px 16px rgba(79,70,229,0.3)}
#cta span{position:relative;z-index:1}
#shine{position:absolute;left:0;top:-10px;width:30px;height:70px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:translateX(-60px) skewX(-20deg)}
#legal{font-size:8px;line-height:1.3;color:#6B7079}
#logo{display:flex;align-items:center;gap:8px}
#num{display:block;font-weight:900;letter-spacing:-1px;line-height:1;color:#4F46E5;font-variant-numeric:tabular-nums}
#st span{font-size:10.5px;color:#6B7079}
#ch{width:160px;height:120px}
#ch svg{display:block}
#dr{opacity:0}
#logo{left:0;top:22px;width:100%;flex-direction:column;gap:8px}
.mk{width:36px;height:36px;border-radius:10px}
.bn{font-size:13px;text-align:center}
#st{left:0;top:100px;width:100%;text-align:center}
#num{font-size:38px}
#ch{left:0;top:170px}
#ct{left:14px;top:312px;width:132px}
#hl{font-size:18px}
#sub{margin-top:8px;font-size:11px;line-height:1.45}
.fl{margin-top:14px}
#cta{left:14px;bottom:48px;width:132px;height:40px;font-size:12px}
#legal{left:10px;bottom:16px;width:140px;text-align:center}
.fl{list-style:none;display:grid;gap:9px}
.fl li{display:flex;align-items:flex-start;gap:7px;font-size:10.5px;line-height:1.3}
.fl svg{flex:0 0 12px;width:12px;height:12px;margin-top:1px;color:#4F46E5}
</style>
</head>
<body>
<div id="ad" onclick="window.open(window.clickTag)">
<div id="logo"><span class="mk"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="6" width="15" height="15" rx="3"/><rect x="27" y="6" width="15" height="15" rx="3"/><rect x="6" y="27" width="15" height="15" rx="3"/><path d="M34.5 27v15M27 34.5h15"/></svg></span><span class="bn">Stackly</span></div>
<div id="ch"><svg width="160" height="120" viewBox="0 0 160 120" aria-hidden="true"><path d="M0 30H160" stroke="rgba(17,24,39,0.08)" stroke-dasharray="3 5"/><path d="M0 60H160" stroke="rgba(17,24,39,0.08)" stroke-dasharray="3 5"/><path d="M0 90H160" stroke="rgba(17,24,39,0.08)" stroke-dasharray="3 5"/><rect class="br" x="8.0" y="96.5" width="13.7" height="23.5" rx="2" fill="rgba(79,70,229,0.38)"/><rect class="br" x="29.7" y="76.0" width="13.7" height="44.0" rx="2" fill="rgba(79,70,229,0.38)"/><rect class="br" x="51.4" y="63.6" width="13.7" height="56.4" rx="2" fill="rgba(79,70,229,0.38)"/><rect class="br" x="73.1" y="62.6" width="13.7" height="57.4" rx="2" fill="rgba(79,70,229,0.38)"/><rect class="br" x="94.9" y="50.4" width="13.7" height="69.6" rx="2" fill="rgba(79,70,229,0.38)"/><rect class="br" x="116.6" y="27.3" width="13.7" height="92.7" rx="2" fill="rgba(79,70,229,0.38)"/><rect class="br" x="138.3" y="12.5" width="13.7" height="107.5" rx="2" fill="#4F46E5"/></svg></div>
<div id="st"><b id="num">10x</b><span>faster app builds</span></div>
<div id="ct"><div id="hl" class="hd">No-Code<br><em>App Builder</em></div><p id="sub">Drag, drop &amp; publish in a day</p><ul class="fl"><li><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6.5 5 9l5-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>100+ templates</span></li><li><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6.5 5 9l5-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Built-in database</span></li><li><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6.5 5 9l5-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>One-click publish</span></li></ul></div>
<div id="cta"><span>Build Free</span><i id="shine"></i></div>
</div>
<script type="text/javascript">
(function () {
  if (!window.gsap) return; // fallback: the static end frame stays visible
  var N={v:0},E=document.getElementById("num");function F(v){return ""+v.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g,",")+"x"}
  // 6s loop x 2 plays + 1s pause = 13s total, then rests on the end frame
  gsap.timeline({ repeat: 1, repeatDelay: 1 })
    .from("#logo",{autoAlpha:0,duration:.4},0)
    .from("#st",{autoAlpha:0,y:10,duration:.35},.2)
    .fromTo(N,{v:0},{v:10,duration:1.5,ease:"power2.out",onUpdate:function(){E.textContent=F(N.v)}},.2)
    .from(".br",{scaleY:0,transformOrigin:"50% 100%",stagger:.1,duration:.5,ease:"power3.out"},.3)
    .from("#hl",{autoAlpha:0,y:12,duration:.45,ease:"power3.out"},2.3)
    .from("#sub",{autoAlpha:0,duration:.4},2.55)
    .from(".fl li",{autoAlpha:0,x:-10,stagger:.15,duration:.35},2.7)
    .from("#cta",{autoAlpha:0,scale:.6,duration:.45,ease:"back.out(2)"},3.2)
    .to("#cta",{scale:1.06,duration:.25,yoyo:true,repeat:3,ease:"sine.inOut"},4.3)
    .to("#shine",{x:220,duration:.8,ease:"power2.inOut"},4.45)
    .set({},{},6);
})();
</script>
</body>
</html>
