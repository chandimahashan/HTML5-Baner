<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="ad.size" content="width=300,height=250">
<title>MeetSpace — MeetSpace Video | 300x250</title>
<script type="text/javascript">var clickTag = "https://www.google.com";</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:300px;height:250px;overflow:hidden;background:#F8FAFC}
#ad{position:relative;width:300px;height:250px;overflow:hidden;cursor:pointer;border:1px solid #e2e8f0;background:linear-gradient(160deg,#E8F4FB 0%,#F8FAFC 72%);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;color:#0F172A;-webkit-font-smoothing:antialiased;user-select:none}
#ad>*{position:absolute}
.hd{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:800;letter-spacing:-.5px;line-height:1.1}
.hd em{font-style:normal;color:#0EA5E9}
.mk{display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0EA5E9,#6366F1);color:#FFFFFF}
.mk svg{width:62%;height:62%}
.bn{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:800;letter-spacing:-.2px;white-space:nowrap}
#sub{color:#686D7A}
#cta{z-index:2;display:flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap;border-radius:10px;background:#0EA5E9;color:#FFFFFF;font-weight:700;letter-spacing:.2px;box-shadow:0 6px 16px rgba(14,165,233,0.3)}
#cta span{position:relative;z-index:1}
#shine{position:absolute;left:0;top:-10px;width:30px;height:70px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:translateX(-60px) skewX(-20deg)}
#legal{font-size:8px;line-height:1.3;color:#686D7A}
#logo{display:flex;align-items:center;gap:8px}
.cd{display:flex;align-items:center;gap:8px;padding:0 10px;border-radius:8px;background:#FFFFFF;border:1px solid rgba(15,23,42,0.08);box-shadow:0 6px 14px rgba(0,0,0,0.08);font-weight:600;line-height:1.15}
.cd i{flex:0 0 18px;display:flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:#0EA5E9;color:#FFFFFF}
.cd i svg{width:10px;height:10px}
#hero{display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(14,165,233,0.12);border:1px solid rgba(14,165,233,0.35);color:#0EA5E9}
#hero svg{width:56%;height:56%}
#cd1{left:16px;top:100px;width:176px;height:28px;font-size:11px;transform:rotate(-2deg)}
#cd2{left:26px;top:134px;width:176px;height:28px;font-size:11px;transform:rotate(1.5deg)}
#cd3{left:18px;top:168px;width:176px;height:28px;font-size:11px;transform:rotate(-1deg)}
#logo{left:14px;top:12px}
.mk{width:22px;height:22px;border-radius:6px}
.bn{font-size:12.5px}
#hl{left:16px;top:40px;width:268px;font-size:19px}
#hero{left:206px;top:112px;width:78px;height:78px}
#cta{left:16px;bottom:12px;height:32px;padding:0 18px;font-size:12.5px}
#legal{right:12px;bottom:8px;max-width:100px;text-align:right}
</style>
</head>
<body>
<div id="ad" onclick="window.open(window.clickTag)">
<div id="logo"><span class="mk"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="12" width="28" height="24" rx="4"/><path d="M32 21l12-7v20l-12-7z"/></svg></span><span class="bn">MeetSpace</span></div>
<div id="hl" class="hd">Video Calls<br><em>That Just Work</em></div>
<div id="cd1" class="cd"><i><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6.5 5 9l5-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></i><span>HD video for 100</span></div>
<div id="cd2" class="cd"><i><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6.5 5 9l5-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></i><span>AI meeting notes</span></div>
<div id="cd3" class="cd"><i><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6.5 5 9l5-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></i><span>Works in browser</span></div>
<div id="hero"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="12" width="28" height="24" rx="4"/><path d="M32 21l12-7v20l-12-7z"/></svg></div>
<div id="cta"><span>Start a Meeting</span><i id="shine"></i></div>
</div>
<script type="text/javascript">
(function () {
  if (!window.gsap) return; // fallback: the static end frame stays visible
  // 6s loop x 2 plays + 1s pause = 13s total, then rests on the end frame
  gsap.timeline({ repeat: 1, repeatDelay: 1 })
    .from(".cd",{x:270,rotation:14,autoAlpha:0,stagger:.35,duration:.55,ease:"back.out(1.5)"},.15)
    .from(".cd i",{scale:0,stagger:.35,duration:.3,ease:"back.out(3)"},.5)
    .from("#logo",{autoAlpha:0,y:-8,duration:.35},1.4)
    .from("#hl",{autoAlpha:0,y:14,duration:.45,ease:"power3.out"},1.6)
    .from("#hero",{scale:0,autoAlpha:0,duration:.5,ease:"back.out(1.8)"},1.9)
    .to(".cd",{y:"-=3",duration:.3,stagger:.1,yoyo:true,repeat:1,ease:"sine.inOut"},2.6)
    .from("#cta",{autoAlpha:0,scale:.6,duration:.45,ease:"back.out(2)"},2.9)
    .to("#cta",{scale:1.06,duration:.25,yoyo:true,repeat:3,ease:"sine.inOut"},4.3)
    .to("#shine",{x:220,duration:.8,ease:"power2.inOut"},4.45)
    .set({},{},6);
})();
</script>
</body>
</html>
