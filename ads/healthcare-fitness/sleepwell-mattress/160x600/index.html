<style>
*{margin:0;padding:0;box-sizing:border-box}

#logo{left:0;top:22px;width:100%;flex-direction:column;gap:8px}
.mk{width:36px;height:36px;border-radius:10px}
.bn{font-size:13px;text-align:center}
#st{left:0;top:100px;width:100%;text-align:center}
#num{font-size:38px}
#ch{left:0;top:170px}

#hl{font-size:18px}
#sub{margin-top:8px;font-size:11px;line-height:1.45}

</head>
<body>
<div id="ad" onclick="window.open(window.clickTag)">
<div id="logo"><span class="mk"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M30 6a18 18 0 1 0 12 28A15 15 0 0 1 30 6z"/><path d="M37 8v6M34 11h6"/></svg></span><span class="bn">SleepWell</span></div>
<div id="ch"><svg width="160" height="120" viewBox="0 0 160 120" aria-hidden="true"><defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A78BFA" stop-opacity=".35"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></linearGradient></defs><path d="M0 30H160" stroke="rgba(238,242,255,0.08)" stroke-dasharray="3 5"/><path d="M0 60H160" stroke="rgba(238,242,255,0.08)" stroke-dasharray="3 5"/><path d="M0 90H160" stroke="rgba(238,242,255,0.08)" stroke-dasharray="3 5"/><path id="ar" d="M0.0 92.9L20.0 73.9L40.0 76.3L60.0 58.2L80.0 49.1L100.0 33.5L120.0 27.7L140.0 32.2L154.0 8.5L154.0 120L0 120Z" fill="url(#ag)"/><path id="ln" d="M0.0 92.9L20.0 73.9L40.0 76.3L60.0 58.2L80.0 49.1L100.0 33.5L120.0 27.7L140.0 32.2L154.0 8.5" fill="none" stroke="#A78BFA" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="0"/><circle id="dr" cx="154.0" cy="8.5" r="4" fill="none" stroke="#A78BFA" stroke-width="1.5"/><circle id="dt" cx="154.0" cy="8.5" r="4" fill="#A78BFA"/></svg></div>

<div id="cta"><span>Try 100 Nights</span><i id="shine"></i></div>
</div>
<script type="text/javascript">
(function () {
  if (!window.gsap) return; // fallback: the static end frame stays visible
  var N={v:0},E=document.getElementById("num");function F(v){return ""+v.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g,",")+""}
  // 6s loop x 2 plays + 1s pause = 13s total, then rests on the end frame
  gsap.timeline({ repeat: 1, repeatDelay: 1 })
    .from("#logo",{autoAlpha:0,duration:.4},0)
    .from("#st",{autoAlpha:0,y:10,duration:.35},.2)
    .fromTo(N,{v:0},{v:92,duration:1.5,ease:"power2.out",onUpdate:function(){E.textContent=F(N.v)}},.2)
    .fromTo("#ln",{attr:{"stroke-dashoffset":1}},{attr:{"stroke-dashoffset":0},duration:1.5,ease:"power2.inOut"},.3)
    .from("#ar",{autoAlpha:0,duration:.8},1.2)
    .from("#dt",{scale:0,transformOrigin:"50% 50%",duration:.35,ease:"back.out(3)"},1.75)
    .fromTo("#dr",{scale:1,autoAlpha:.9,transformOrigin:"50% 50%"},{scale:3.2,autoAlpha:0,duration:1,repeat:1,immediateRender:false},2)
    .from("#hl",{autoAlpha:0,y:12,duration:.45,ease:"power3.out"},2.3)
    .from("#sub",{autoAlpha:0,duration:.4},2.55)
    .from(".fl li",{autoAlpha:0,x:-10,stagger:.15,duration:.35},2.7)
    .from("#cta",{autoAlpha:0,scale:.6,duration:.45,ease:"back.out(2)"},3.2)
    .to("#cta",{scale:1.06,duration:.25,yoyo:true,repeat:3,ease:"sine.inOut"},4.3)
    .to("#shine",{x:220,duration:.8,ease:"power2.inOut"},4.45)
    .set({},{},6);
})();
</script>
