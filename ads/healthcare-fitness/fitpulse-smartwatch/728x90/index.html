<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="ad.size" content="width=728,height=90">
<title>FitPulse — FitPulse Gym Smartwatch | 728x90</title>
<script type="text/javascript">var clickTag = "https://www.google.com";</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:728px;height:90px;overflow:hidden;background:#0A0A0A}
#ad{position:relative;width:728px;height:90px;overflow:hidden;cursor:pointer;border:1px solid #333;background:radial-gradient(120% 120% at 80% 10%,#2A0D0D 0%,#0A0A0A 60%);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;color:#FAFAFA;-webkit-font-smoothing:antialiased;user-select:none}
#ad>*,#deco>*{position:absolute}
#deco{inset:0;overflow:hidden}
#rings{left:457px;top:-29px;width:146px;height:146px}
.hd{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:800;letter-spacing:-.5px;line-height:1.1}
.hd em{font-style:normal;color:#EF4444}
#logo{display:flex;align-items:center;gap:8px}
.mk{display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#EF4444,#F97316);color:#FFFFFF}
.mk svg{width:62%;height:62%}
.bn{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:800;letter-spacing:-.2px;white-space:nowrap}
#div{background:linear-gradient(180deg,transparent,rgba(239,68,68,0.5),transparent)}
#hero{display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(239,68,68,0.12);border:1px solid rgba(239,68,68,0.35);color:#EF4444}
#hero svg{width:56%;height:56%}
#badge{z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:50%;transform:rotate(10deg);background:#F97316;color:#FFFFFF;box-shadow:0 6px 16px rgba(249,115,22,0.4)}
#badge::before{content:"";position:absolute;inset:3px;border-radius:50%;border:1px dashed currentColor;opacity:.45}
#badge b{font-weight:900;line-height:1}
#badge span{margin-top:2px;font-size:6.5px;font-weight:800;letter-spacing:.8px}
#sub{color:#A3A3A3}
#cta{z-index:2;display:flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap;border-radius:8px;background:linear-gradient(90deg,#EF4444,#F97316);color:#FFFFFF;font-weight:700;letter-spacing:.2px;box-shadow:0 6px 16px rgba(239,68,68,0.3)}
#cta span{position:relative;z-index:1}
#shine{position:absolute;left:0;top:-10px;width:30px;height:70px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:translateX(-60px) skewX(-20deg)}
#legal{font-size:8px;line-height:1.3;color:#A3A3A3}
#intro{inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;visibility:hidden}
#intro .ii{color:#EF4444}
#intro .il{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:900;letter-spacing:-.8px;line-height:1.05}
#intro .il2{color:#EF4444;}

#logo{left:16px;top:0;height:88px}
.mk{width:38px;height:38px;border-radius:10px}
.bn{font-size:17px}
#div{left:200px;top:20px;width:1px;height:48px}
#content{left:216px;top:0;width:272px;height:88px;display:flex;flex-direction:column;justify-content:center}
#hl{font-size:19px;white-space:nowrap}
#sub{margin-top:4px;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#badge,#hero{left:502px;top:16px;width:56px;height:56px}
#badge b{font-size:15px}
#cta{left:576px;top:24px;width:136px;height:40px;font-size:13px}
#legal{left:566px;top:64px;width:156px;text-align:center}
#intro{flex-direction:row;gap:14px}
#intro .ii{width:40px;height:40px}
#intro .il{font-size:24px}
</style>
</head>
<body>
<div id="ad" onclick="window.open(window.clickTag)">
<div id="deco"><svg id="rings" viewBox="0 0 200 200" fill="none" aria-hidden="true"><circle cx="100" cy="100" r="46" stroke="rgba(239,68,68,0.35)"/><circle cx="100" cy="100" r="70" stroke="rgba(239,68,68,0.25)" stroke-dasharray="4 6"/><circle cx="100" cy="100" r="96" stroke="rgba(249,115,22,0.2)"/></svg></div>
<div id="logo"><span class="mk"><svg class="" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="12" y="12" width="24" height="24" rx="6"/><path d="M18 12l2-7h8l2 7M18 36l2 7h8l2-7"/><path d="M15 25h5l2-4 4 8 2-4h5"/></svg></span><span class="bn">FitPulse</span></div>
<i id="div"></i>
<div id="badge"><b>NEW</b><span>SERIES 5</span></div>
<div id="content"><div id="hl" class="hd">Train Smarter <em>Every Day</em></div><p id="sub">Heart rate, VO₂ max &amp; built-in GPS</p></div>
<div id="cta"><span>Pre-Order Now</span><i id="shine"></i></div>
<div id="intro"><svg class="ii" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="12" y="12" width="24" height="24" rx="6"/><path d="M18 12l2-7h8l2 7M18 36l2 7h8l2-7"/><path d="M15 25h5l2-4 4 8 2-4h5"/></svg><div class="it"><span class="il">Every Beat</span> <span class="il il2">Counts</span></div></div>
</div>
<script type="text/javascript">
(function () {
  if (!window.gsap) return; // fallback: the static end frame stays visible
  // 6s loop x 2 plays + 1s pause = 13s total, then rests on the end frame
  gsap.timeline({ repeat: 1, repeatDelay: 1 })
    .set("#intro",{autoAlpha:1},0)
    .from("#deco",{autoAlpha:0,duration:.8},0)
    .from("#rings",{scale:.5,duration:1.2,ease:"power2.out"},0)
    .to("#rings",{rotation:60,duration:6,ease:"none"},0)
    .from("#intro .ii",{scale:0,rotation:-25,duration:.6,ease:"back.out(2)"},.15)
    .from("#intro .il",{autoAlpha:0,y:18,stagger:.15,duration:.5,ease:"power3.out"},.4)
    .to("#intro",{autoAlpha:0,duration:.35,ease:"power2.in"},2.1)
    .from("#logo",{autoAlpha:0,x:-12,duration:.4},2.35)
    .from("#div",{scaleY:0,duration:.3},2.5)
    .from("#hl",{autoAlpha:0,y:14,duration:.45,ease:"power3.out"},2.6)
    .from("#sub",{autoAlpha:0,y:8,duration:.4},2.85)
    .from("#badge",{scale:0,rotation:-160,duration:.55,ease:"back.out(2)"},3.05)
    .from("#cta",{autoAlpha:0,scale:.6,duration:.45,ease:"back.out(2)"},3.6)
    .to("#cta",{scale:1.06,duration:.25,yoyo:true,repeat:3,ease:"sine.inOut"},4.3)
    .to("#shine",{x:220,duration:.8,ease:"power2.inOut"},4.45)
    .set({},{},6);
})();
</script>
</body>
</html>
