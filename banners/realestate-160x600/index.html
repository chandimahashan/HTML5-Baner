<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="ad.size" content="width=160,height=600">
<title>The Grand Residences | 160x600</title>

<script type="text/javascript">
  var clickTag = "https://www.google.com";
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 160px; height: 600px; overflow: hidden; background: #161618; }

  #ad {
    position: relative;
    width: 160px;
    height: 600px;
    overflow: hidden;
    cursor: pointer;
    border: 1px solid #4A4232;
    background: linear-gradient(180deg, #111113 0%, #1E1E21 45%, #19191B 100%);
    font-family: Georgia, "Times New Roman", serif;
    color: #F3E9D2;
    text-align: center;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }
  .abs { position: absolute; left: 0; width: 100%; }
  .sans { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }

  #frameLine { position: absolute; inset: 6px; border: 1px solid rgba(201,164,92,.35); pointer-events: none; }

  /* ---------- Brand ---------- */
  #mono { top: 22px; left: 68px; width: 24px; height: 24px; }
  #name1 { top: 52px; font-size: 15px; letter-spacing: 3px; }
  #name2 { top: 72px; font-size: 8px; letter-spacing: 4.5px; color: #C9A45C; }

  /* ---------- Skyline ---------- */
  #skyline { top: 94px; height: 232px; }
  #skyline svg { display: block; width: 160px; height: 232px; }

  /* ---------- Copy ---------- */
  #hl1 { top: 338px; font-size: 19px; font-style: italic; }
  #hl2 { top: 364px; font-size: 7.5px; letter-spacing: 3px; color: #C9A45C; }
  #rule { top: 384px; left: 65px; width: 30px; height: 1px; background: #C9A45C; }

  #features { top: 400px; left: 16px; width: 128px; list-style: none; text-align: left; }
  .feat { display: flex; align-items: center; gap: 9px; height: 26px; font-size: 10.5px; color: #D9D2C3; border-bottom: 1px solid rgba(201,164,92,.14); }
  .feat:last-child { border-bottom: 0; }
  .feat svg { flex: 0 0 15px; width: 15px; height: 15px; }

  #limited { top: 490px; font-size: 10px; font-style: italic; color: #C9A45C; }

  /* ---------- CTA ---------- */
  #cta {
    top: 514px; left: 16px; width: 128px; height: 40px;
    overflow: hidden;
    border-radius: 2px;
    background: linear-gradient(135deg, #EED79C 0%, #C9A45C 50%, #A8843F 100%);
    box-shadow: 0 6px 16px rgba(201,164,92,.25);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; letter-spacing: .4px; color: #1B1B1D;
  }
  #cta span { position: relative; z-index: 1; }
  #shine { position: absolute; top: -10px; left: 50%; width: 30px; height: 60px; margin-left: -15px; background: linear-gradient(90deg, transparent, rgba(255,255,255,.65), transparent); transform: translateX(-160px) skewX(-20deg); }

  #foot { top: 570px; font-size: 7px; letter-spacing: 2px; color: #8A8478; }
</style>
</head>
<body>
<div id="ad" onclick="window.open(window.clickTag)">
  <div id="frameLine"></div>

  <!-- Brand -->
  <svg id="mono" class="abs" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M12 1 23 12 12 23 1 12Z" fill="none" stroke="#C9A45C" stroke-width="1"/>
    <path d="M12 4.5 19.5 12 12 19.5 4.5 12Z" fill="none" stroke="#C9A45C" stroke-width=".6" opacity=".6"/>
    <text x="12" y="15.6" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#E8CF8E">G</text>
  </svg>
  <div id="name1" class="abs">THE GRAND</div>
  <div id="name2" class="abs sans">RESIDENCES</div>

  <!-- Skyline illustration (windows generated below) -->
  <div id="skyline" class="abs">
    <svg viewBox="0 0 160 232" aria-hidden="true">
      <defs>
        <linearGradient id="tw" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#34343A"/>
          <stop offset=".5" stop-color="#2A2A2F"/>
          <stop offset="1" stop-color="#1D1D21"/>
        </linearGradient>
        <linearGradient id="ground" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#C9A45C" stop-opacity="0"/>
          <stop offset=".5" stop-color="#C9A45C"/>
          <stop offset="1" stop-color="#C9A45C" stop-opacity="0"/>
        </linearGradient>
      </defs>

      <circle cx="128" cy="24" r="7" fill="#E8CF8E" opacity=".22"/>
      <g fill="#F3E9D2" opacity=".5">
        <circle cx="24" cy="30" r=".7"/><circle cx="44" cy="62" r=".6"/><circle cx="118" cy="70" r=".6"/>
        <circle cx="142" cy="48" r=".7"/><circle cx="16" cy="96" r=".6"/><circle cx="36" cy="14" r=".5"/>
      </g>

      <g id="back" fill="#242428">
        <rect x="8" y="140" width="30" height="92"/>
        <rect x="30" y="170" width="24" height="62"/>
        <rect x="114" y="118" width="36" height="114"/>
        <rect x="104" y="162" width="20" height="70"/>
        <g id="backWin"></g>
      </g>

      <g id="tower">
        <line x1="80" y1="3" x2="80" y2="26" stroke="#C9A45C" stroke-width="1"/>
        <path d="M69 46 80 24 91 46Z" fill="#2E2E33" stroke="#C9A45C" stroke-width=".6"/>
        <rect x="62" y="46" width="36" height="24" fill="url(#tw)"/>
        <rect x="56" y="70" width="48" height="162" fill="url(#tw)"/>
        <g stroke="#C9A45C" stroke-width=".6" opacity=".55">
          <line x1="56.3" y1="70" x2="56.3" y2="232"/><line x1="103.7" y1="70" x2="103.7" y2="232"/>
          <line x1="62.3" y1="46" x2="62.3" y2="70"/><line x1="97.7" y1="46" x2="97.7" y2="70"/>
          <line x1="56" y1="70.3" x2="104" y2="70.3"/>
        </g>
        <g id="towerWin"></g>
        <circle id="beaconGlow" style="opacity:0" cx="80" cy="3" r="2" fill="none" stroke="#E8CF8E" stroke-width=".6"/>
        <circle id="beacon" cx="80" cy="3" r="1.8" fill="#E8CF8E"/>
      </g>

      <rect x="0" y="231" width="160" height="1" fill="url(#ground)"/>
    </svg>
  </div>

  <!-- Copy -->
  <div id="hl1" class="abs">Elevated Living</div>
  <div id="hl2" class="abs sans">ABOVE THE SKYLINE</div>
  <div id="rule" class="abs"></div>

  <ul id="features" class="abs sans">
    <li class="feat">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 3h11L8 9.5ZM8 9.5V14M5 14h6" fill="none" stroke="#C9A45C" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/></svg>
      Sky Lounge &amp; Pool
    </li>
    <li class="feat">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 12.5h12M3 12.5a5 5 0 0 1 10 0M8 5.5V4M6.5 4h3" fill="none" stroke="#C9A45C" stroke-width="1.2" stroke-linecap="round"/></svg>
      24/7 Concierge
    </li>
    <li class="feat">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 13 5.5 7.5l3 3 2.5-3.5 3.5 6ZM11.5 4.5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0" fill="none" stroke="#C9A45C" stroke-width="1.2" stroke-linejoin="round"/></svg>
      Panoramic Views
    </li>
  </ul>

  <div id="limited" class="abs">Limited residences available</div>

  <!-- CTA -->
  <div id="cta" class="abs sans"><span>Book Private Tour</span><i id="shine"></i></div>
  <div id="foot" class="abs sans">BY APPOINTMENT ONLY</div>
</div>

<script type="text/javascript">
  (function () {
    var NS = "http://www.w3.org/2000/svg";
    var seed = 7;
    function rand() { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }

    // Build window grids so the file stays tiny
    function addWindows(group, x0, y0, cols, rows, dx, dy, w, h, maxOpacity) {
      for (var r = 0; r < rows; r++) {
        for (var c = 0; c < cols; c++) {
          var rect = document.createElementNS(NS, "rect");
          var lit = rand();
          rect.setAttribute("x", x0 + c * dx);
          rect.setAttribute("y", y0 + r * dy);
          rect.setAttribute("width", w);
          rect.setAttribute("height", h);
          rect.setAttribute("fill", "#E8CF8E");
          rect.setAttribute("class", "w");
          rect.style.opacity = (lit < .28 ? .1 : (.4 + lit * .6) * maxOpacity).toFixed(2);
          group.appendChild(rect);
        }
      }
    }
    var tw = document.getElementById("towerWin");
    var bw = document.getElementById("backWin");
    addWindows(tw, 59, 76, 6, 19, 7.5, 8, 4, 4.5, 1);    // main shaft
    addWindows(tw, 65, 51, 4, 2, 7.5, 8, 4, 4.5, 1);     // setback
    addWindows(bw, 12, 146, 3, 10, 8, 8.5, 4, 4, .45);   // left block
    addWindows(bw, 118, 124, 4, 12, 8, 8.5, 4, 4, .45);  // right block

    if (!window.gsap) return; // Fallback: static end frame stays visible

    // 2 plays, ~23s total — within the Google Ads 30s animation limit
    var tl = gsap.timeline({ repeat: 1, repeatDelay: 1.5 });

    tl.from("#frameLine", { autoAlpha: 0, scale: 1.05, duration: .8, ease: "power2.out" })
      .from("#mono", { autoAlpha: 0, rotation: -90, scale: .4, transformOrigin: "50% 50%", duration: .6, ease: "back.out(1.7)" }, "-=.5")
      .from("#name1, #name2", { autoAlpha: 0, y: 10, stagger: .15, duration: .5 }, "-=.3")

      .from("#back", { autoAlpha: 0, y: 30, duration: .8, ease: "power3.out" }, "-=.2")
      .from("#tower", { y: 232, duration: 1.1, ease: "power3.out" }, "-=.6")
      .from(".w", { opacity: .04, duration: .25, stagger: { each: .01, from: "random" } }, "-=.2")
      .from("#beacon", { scale: 0, transformOrigin: "50% 50%", duration: .3 }, "-=.6")

      .from("#hl1", { autoAlpha: 0, y: 12, duration: .6, ease: "power2.out" }, "-=1.4")
      .from("#hl2", { autoAlpha: 0, duration: .5 }, "-=.8")
      .from("#rule", { scaleX: 0, duration: .5 }, "-=.3")
      .from(".feat", { autoAlpha: 0, x: -14, stagger: .25, duration: .45, ease: "power2.out" })
      .from("#limited", { autoAlpha: 0, duration: .4 })
      .from("#cta", { autoAlpha: 0, y: 14, duration: .5, ease: "power3.out" }, "-=.1")
      .from("#foot", { autoAlpha: 0, duration: .4 }, "-=.2")

      .to("#shine", { x: 160, duration: 1, ease: "power2.inOut", repeat: 2, repeatDelay: .5 })
      .fromTo("#beaconGlow", { scale: 1, autoAlpha: 1 }, { scale: 3, autoAlpha: 0, transformOrigin: "50% 50%", duration: 1.2, repeat: 2, ease: "power1.out", immediateRender: false }, "<");
  })();
</script>
</body>
</html>
