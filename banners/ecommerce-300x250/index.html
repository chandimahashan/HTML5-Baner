<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="ad.size" content="width=300,height=250">
<title>Sneaker Flash Sale | 300x250</title>

<script type="text/javascript">
  var clickTag = "https://www.google.com";
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 300px; height: 250px; overflow: hidden; background: #0A0A10; }

  #ad {
    position: relative;
    width: 300px;
    height: 250px;
    overflow: hidden;
    cursor: pointer;
    border: 1px solid #3A3A4A;
    background: radial-gradient(120% 90% at 75% 25%, #241834 0%, #0A0A10 62%);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: #FFFFFF;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }
  .abs { position: absolute; }

  
  /* ---------- Intro frame ---------- */
  #intro {
    position: absolute; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #0A0A10;
    visibility: hidden; /* shown by GSAP; hidden if GSAP fails so the end frame shows */
  }
  #bolt { width: 34px; height: 34px; margin-bottom: 4px; }
  .intro-line { font-size: 52px; line-height: .9; font-weight: 900; font-style: italic; letter-spacing: -1px; }
  #introFlash { color: #FFFFFF; }
  #introSale { color: transparent; -webkit-text-stroke: 2px #FF3D5A; }
  #introSub { margin-top: 12px; font-size: 10px; font-weight: 700; letter-spacing: 4px; color: #FFD23F; }

  /* ---------- Product card ---------- */
  #card {
    left: 12px; top: 12px; width: 276px; height: 140px;
    border-radius: 14px;
    background:
      repeating-linear-gradient(135deg, rgba(255,255,255,.025) 0 2px, transparent 2px 12px),
      linear-gradient(145deg, #1C1C2A 0%, #111119 100%);
    border: 1px solid rgba(255,255,255,.08);
    overflow: hidden;
  }
  .speed { position: absolute; height: 2px; border-radius: 2px; background: linear-gradient(90deg, transparent, rgba(255,255,255,.55)); }
  #sp1 { left: 10px; top: 42px; width: 46px; }
  #sp2 { left: 4px;  top: 56px; width: 60px; }
  #sp3 { left: 16px; top: 70px; width: 38px; }
  #shoe { position: absolute; left: 44px; top: 6px; width: 196px; height: 98px; }
  #pname { left: 14px; bottom: 11px; font-size: 9px; font-weight: 700; letter-spacing: 2px; color: #9D9DB5; }
  #price { right: 14px; bottom: 8px; font-size: 17px; font-weight: 800; }
  #price s { font-size: 11px; font-weight: 500; color: #6E6E85; margin-right: 5px; }

  /* ---------- Badge ---------- */
  #badge {
    right: 4px; top: 2px; width: 64px; height: 64px; z-index: 3;
    border-radius: 50%;
    background: #FF3D5A;
    box-shadow: 0 6px 18px rgba(255,61,90,.45);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transform: rotate(12deg);
  }
  #badgeRing { position: absolute; inset: 4px; border-radius: 50%; border: 1.5px dashed rgba(255,255,255,.6); }
  #badge b { font-size: 19px; font-weight: 900; line-height: 1; }
  #badge span { font-size: 9px; font-weight: 800; letter-spacing: 2px; }

  /* ---------- Copy + CTA ---------- */
  #headline { left: 14px; top: 162px; font-size: 25px; font-weight: 900; font-style: italic; letter-spacing: -.5px; text-transform: uppercase; }
  #headline em { color: #FF3D5A; }
  #sub { left: 15px; top: 196px; font-size: 10px; line-height: 1.45; color: #A5A5BC; }
  #sub strong { color: #FFD23F; font-weight: 700; }

  #cta {
    right: 14px; top: 196px; width: 104px; height: 36px; z-index: 2;
    border-radius: 18px;
    background: linear-gradient(135deg, #FF5470, #E8213F);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 800; letter-spacing: .3px;
  }
  #ctaGlow { right: 14px; top: 196px; width: 104px; height: 36px; border-radius: 18px; border: 2px solid #FF3D5A; opacity: 0; }
</style>
</head>
<body>
<div id="ad" onclick="window.open(window.clickTag)">

  <!-- Intro -->
  <div id="intro">
    <svg id="bolt" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z" fill="#FFD23F"/></svg>
    <div id="introFlash" class="intro-line">FLASH</div>
    <div id="introSale" class="intro-line">SALE</div>
    <div id="introSub">24 HOURS ONLY</div>
  </div>

  <!-- Product card -->
  <div id="card" class="abs">
    <i id="sp1" class="speed"></i><i id="sp2" class="speed"></i><i id="sp3" class="speed"></i>
    <svg id="shoe" viewBox="0 0 200 100" aria-hidden="true">
      <defs>
        <linearGradient id="upper" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#FF6A7E"/>
          <stop offset="1" stop-color="#C21E3A"/>
        </linearGradient>
      </defs>
      <ellipse cx="102" cy="94" rx="88" ry="4.5" fill="#000" opacity=".5"/>
      <path d="M8 74Q6 89 22 89H180Q196 89 194 76L192 70H10Z" fill="#F2F2F7"/>
      <path d="M10 70H192L193.4 76H8.6Z" fill="#FFD23F"/>
      <path d="M10 70 16 44Q20 32 32 35L66 46Q80 50 88 38L98 20Q103 13 111 18L132 34Q152 49 178 54Q194 58 192 70Z" fill="url(#upper)"/>
      <path d="M16 44Q14 35 23 34L30 36 22 50Z" fill="#1C1C2A"/>
      <path d="M38 64Q100 68 176 47Q124 60 58 58Z" fill="#FFFFFF" opacity=".92"/>
      <path d="M160 52Q187 56 192 70H170Q166 60 160 52Z" fill="#FFFFFF" opacity=".16"/>
      <g stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round">
        <path d="M113 25 119 33"/><path d="M123 32 128 40"/><path d="M134 39 138 47"/><path d="M146 45 149 52"/>
      </g>
      <g fill="#FFFFFF" opacity=".35"><circle cx="30" cy="80" r="1.4"/><circle cx="44" cy="80" r="1.4"/><circle cx="58" cy="80" r="1.4"/></g>
    </svg>
    <div id="pname" class="abs">AIR VELOCITY X</div>
    <div id="price" class="abs"><s>$150</s>$90</div>
  </div>

  <!-- Badge -->
  <div id="badge" class="abs"><i id="badgeRing"></i><b>40%</b><span>OFF</span></div>

  <!-- Copy -->
  <div id="headline" class="abs">Flat <em>40% Off</em></div>
  <div id="sub" class="abs">Flash Sale on all runners<br><strong>Ends at midnight</strong></div>

  <!-- CTA -->
  <div id="ctaGlow" class="abs"></div>
  <div id="cta" class="abs">Shop Now &rsaquo;</div>
</div>

<script type="text/javascript">
  (function () {
    if (!window.gsap) return; // Fallback: static end frame stays visible

    // 2 plays, ~16s total — within the Google Ads 30s animation limit
    var tl = gsap.timeline({ repeat: 1, repeatDelay: 1.2 });

    tl.set("#intro", { autoAlpha: 1 })
      .from("#bolt", { scale: 0, rotation: -40, duration: .4, ease: "back.out(3)" })
      .from("#introFlash", { x: -300, duration: .45, ease: "power4.out" }, "-=.2")
      .from("#introSale", { x: 300, duration: .45, ease: "power4.out" }, "<")
      .from("#introSub", { autoAlpha: 0, y: 8, duration: .3 })
      .to("#intro", { autoAlpha: 0, scale: 1.25, duration: .35, ease: "power2.in" }, "+=.9")

      .from("#card", { autoAlpha: 0, y: 24, duration: .5, ease: "power3.out" }, "-=.1")
      .from("#shoe", { x: -230, rotation: -12, duration: .7, ease: "power4.out" }, "-=.25")
      .from(".speed", { scaleX: 0, transformOrigin: "right center", stagger: .06, duration: .3 }, "-=.45")
      .to(".speed", { x: -24, autoAlpha: 0, stagger: .05, duration: .4 })
      .from("#pname, #price", { autoAlpha: 0, y: 8, stagger: .1, duration: .35 }, "-=.4")

      .from("#badge", { scale: 0, rotation: -200, duration: .6, ease: "back.out(2)" })
      .to("#badgeRing", { rotation: 180, duration: 4, ease: "none" }, "<")
      .from("#headline", { autoAlpha: 0, y: 16, duration: .4, ease: "power3.out" }, "<.2")
      .from("#sub", { autoAlpha: 0, duration: .3 })
      .from("#cta", { scale: 0, duration: .45, ease: "back.out(2.2)" }, "-=.1")

      // Pulsing CTA (even repeat count so it settles at scale 1)
      .to("#cta", { scale: 1.08, duration: .3, ease: "sine.inOut", yoyo: true, repeat: 5 }, "+=.2")
      .fromTo("#ctaGlow", { scale: 1, autoAlpha: .8 }, { scale: 1.35, autoAlpha: 0, duration: .9, repeat: 1, ease: "power1.out", immediateRender: false }, "<");
  })();
</script>
</body>
</html>
