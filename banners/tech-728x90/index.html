<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="ad.size" content="width=728,height=90">
<title>TaskFlow AI | 728x90</title>

<script type="text/javascript">
  var clickTag = "https://www.google.com";
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 728px; height: 90px; overflow: hidden; background: #0E1024; }

  #ad {
    position: relative;
    width: 728px;
    height: 90px;
    overflow: hidden;
    cursor: pointer;
    border: 1px solid #2B2F55;
    background: linear-gradient(100deg, #0E1024 0%, #131739 55%, #0E1024 100%);
    font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: #F8FAFC;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }
  .abs { position: absolute; }
  .grad-text {
    background: linear-gradient(90deg, #818CF8, #22D3EE);
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
  }

  /* ---------- Background accents ---------- */
  .orb { position: absolute; border-radius: 50%; filter: blur(28px); }
  #orb1 { width: 180px; height: 180px; left: 180px; top: -110px; background: rgba(99,102,241,.35); }
  #orb2 { width: 160px; height: 160px; left: 470px; top: 30px; background: rgba(34,211,238,.22); }
  #topLine { left: 0; top: 0; width: 100%; height: 2px; background: linear-gradient(90deg, #6366F1, #22D3EE, #A855F7); }

  /* ---------- Logo ---------- */
  #logo { left: 20px; top: 0; height: 88px; display: flex; align-items: center; gap: 10px; }
  #logoIcon { width: 40px; height: 40px; }
  #wordmark { font-size: 21px; font-weight: 800; letter-spacing: -.4px; white-space: nowrap; }
  #wordmark span { font-weight: 800; }
  #divider { left: 196px; top: 22px; width: 1px; height: 44px; background: linear-gradient(180deg, transparent, rgba(129,140,248,.6), transparent); }

  /* ---------- Message frames ---------- */
  #msg { left: 218px; top: 0; width: 330px; height: 88px; }
  .frame { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; }
  #f1, #f2 { visibility: hidden; } /* intermediate frames — end frame (#f3) is the static fallback */
  #f1 { font-size: 20px; font-weight: 600; color: #C7CBE8; }
  #f1 b { color: #F8FAFC; }

  #f2 { flex-direction: row; align-items: center; gap: 8px; }
  .chip {
    display: flex; align-items: center; gap: 7px;
    height: 32px; padding: 0 12px 0 7px;
    border-radius: 16px;
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(129,140,248,.35);
    font-size: 12.5px; font-weight: 600; white-space: nowrap;
  }
  .check { position: relative; width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.35); }
  .check i { position: absolute; inset: -1.5px; border-radius: 50%; background: linear-gradient(135deg, #6366F1, #22D3EE); }
  .check svg { position: absolute; left: 2px; top: 2px; width: 11px; height: 11px; }

  #f3 h1 { font-size: 25px; line-height: 1.1; font-weight: 800; letter-spacing: -.5px; }
  #f3 p { margin-top: 4px; font-size: 12px; color: #A5ABD6; }

  /* ---------- CTA ---------- */
  #cta {
    left: 560px; top: 24px; width: 150px; height: 40px;
    border-radius: 8px;
    overflow: hidden;
    background: linear-gradient(90deg, #6366F1, #22D3EE);
    box-shadow: 0 6px 18px rgba(99,102,241,.45);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 700; color: #FFFFFF;
  }
  #cta span { position: relative; z-index: 1; }
  #shine { position: absolute; top: -10px; left: 50%; width: 36px; height: 60px; margin-left: -18px; background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent); transform: translateX(-180px) skewX(-20deg); }
  #fine { left: 560px; top: 68px; width: 150px; text-align: center; font-size: 9px; color: #7C83B8; letter-spacing: .3px; }
</style>
</head>
<body>
<div id="ad" onclick="window.open(window.clickTag)">

  <div id="orb1" class="orb"></div>
  <div id="orb2" class="orb"></div>
  <div id="topLine" class="abs"></div>

  <!-- Logo -->
  <div id="logo" class="abs">
    <svg id="logoIcon" viewBox="0 0 40 40" aria-hidden="true">
      <defs>
        <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#6366F1"/>
          <stop offset="1" stop-color="#22D3EE"/>
        </linearGradient>
      </defs>
      <rect width="40" height="40" rx="10" fill="url(#lg)"/>
      <g stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M10 14h11M10 20h7M10 26h13"/>
        <path d="M24 17.5l3 3 5.5-6.5"/>
      </g>
      <circle cx="29" cy="27" r="2.6" fill="#FFFFFF"/>
    </svg>
    <div id="wordmark">TaskFlow <span class="grad-text">AI</span></div>
  </div>
  <div id="divider" class="abs"></div>

  <!-- Messaging -->
  <div id="msg" class="abs">
    <div id="f1" class="frame"><span>Still doing <b>busywork</b> by hand?</span></div>

    <div id="f2" class="frame">
      <div class="chip"><span class="check"><i></i><svg viewBox="0 0 12 12"><path d="M2 6.5 5 9l5-6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Emails</div>
      <div class="chip"><span class="check"><i></i><svg viewBox="0 0 12 12"><path d="M2 6.5 5 9l5-6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Reports</div>
      <div class="chip"><span class="check"><i></i><svg viewBox="0 0 12 12"><path d="M2 6.5 5 9l5-6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Scheduling</div>
    </div>

    <div id="f3" class="frame">
      <h1>Automate Your <span class="grad-text">Workflow</span></h1>
      <p>AI that sorts, schedules &amp; ships your team&rsquo;s tasks.</p>
    </div>
  </div>

  <!-- CTA -->
  <div id="cta" class="abs"><span>Start Free Trial</span><i id="shine"></i></div>
  <div id="fine" class="abs">No credit card required</div>
</div>

<script type="text/javascript">
  (function () {
    if (!window.gsap) return; // Fallback: static end frame stays visible

    // 2 plays, ~19s total — within the Google Ads 30s animation limit
    var tl = gsap.timeline({ repeat: 1, repeatDelay: 1.2 });

    tl.to("#orb1", { x: 260, duration: 9, ease: "sine.inOut" }, 0)
      .to("#orb2", { x: -180, duration: 9, ease: "sine.inOut" }, 0)

      .from("#topLine", { scaleX: 0, transformOrigin: "left center", duration: .6, ease: "power2.inOut" }, 0)
      .from("#logoIcon", { scale: 0, rotation: -90, duration: .5, ease: "back.out(2)" }, .2)
      .from("#wordmark", { x: -12, autoAlpha: 0, duration: .4 }, "-=.2")
      .from("#divider", { scaleY: 0, duration: .3 }, "-=.2")

      // Frame 1 — the problem
      .fromTo("#f1", { autoAlpha: 0, y: 16 }, { autoAlpha: 1, y: 0, duration: .4, ease: "power3.out" })
      .to("#f1", { autoAlpha: 0, y: -16, duration: .3, ease: "power2.in" }, "+=1.3")

      // Frame 2 — tasks get checked off
      .set("#f2", { autoAlpha: 1 })
      .from(".chip", { autoAlpha: 0, y: 14, stagger: .12, duration: .35, ease: "back.out(1.6)" })
      .from(".check i", { scale: 0, stagger: .3, duration: .3, ease: "back.out(2.5)" }, "+=.1")
      .from(".check svg", { scale: 0, stagger: .3, duration: .3, ease: "back.out(2.5)" }, "<.1")
      .to("#f2", { autoAlpha: 0, y: -16, duration: .3, ease: "power2.in" }, "+=.8")

      // Frame 3 — end frame
      .fromTo("#f3", { autoAlpha: 0, y: 16 }, { autoAlpha: 1, y: 0, duration: .45, ease: "power3.out" })
      .from("#cta", { autoAlpha: 0, x: 30, duration: .45, ease: "back.out(1.7)" }, "-=.2")
      .from("#fine", { autoAlpha: 0, duration: .3 }, "-=.1")
      .to("#shine", { x: 180, duration: .8, ease: "power2.inOut", repeat: 1, repeatDelay: .5 })
      .to("#cta", { scale: 1.05, duration: .25, ease: "sine.inOut", yoyo: true, repeat: 3 }, "<");
  })();
</script>
</body>
</html>
